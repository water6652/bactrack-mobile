<!DOCTYPE html>
<!-- BacTrack · v7.4.2 (apk) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>BacTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* ---------------------------------------------------------------
   TOKENS
   --------------------------------------------------------------- */
:root{
  --bg:#ffffff;
  --fg:#2b2b2b;
  --fg-mid:#6e6e6e;
  --fg-soft:#9a9a9a;
  --fg-faint:#c9c9c9;
  --line:#ededed;
  --line-strong:#dcdcdc;
  --field:#f6f6f6;
  --accent:#c0392b;
  --ok:#3f7d58;
  --dh:1.14em;              /* digit cell height */
  --ease:cubic-bezier(.16,1,.3,1);
  --speed:1;
  --radius:10px;
  --fs-scale:1;
  --ui-scale:1;
  --fw:400;
  --fw-display:200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --fg:#e4e4e4; --fg-mid:#a0a0a0; --fg-soft:#7a7a7a;
    --fg-faint:#3d3d3d; --line:#242424; --line-strong:#333333; --field:#1b1b1b;
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --fg:#e4e4e4; --fg-mid:#a0a0a0; --fg-soft:#7a7a7a;
  --fg-faint:#3d3d3d; --line:#242424; --line-strong:#333333; --field:#1b1b1b;
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{
  height:100%; overflow:hidden;
  font-size:calc(16px * var(--fs-scale));
  background:var(--bg);
  position:relative;
}
html::before,html::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:0; transition:opacity calc(1.2s * var(--speed)) var(--ease);
}
html::before{
  background-image:
    radial-gradient(circle at 8% 18%,rgba(255,255,255,.70) 0 1px,transparent 1.6px),
    radial-gradient(circle at 24% 72%,rgba(210,230,255,.52) 0 1px,transparent 1.5px),
    radial-gradient(circle at 43% 28%,rgba(255,255,255,.58) 0 1px,transparent 1.5px),
    radial-gradient(circle at 67% 16%,rgba(210,230,255,.62) 0 1px,transparent 1.5px),
    radial-gradient(circle at 82% 62%,rgba(255,255,255,.52) 0 1px,transparent 1.5px),
    radial-gradient(circle at 92% 31%,rgba(205,225,255,.48) 0 1px,transparent 1.5px);
  background-size:100% 100%;
  animation:skyDriftA 180s linear infinite;
}
html::after{
  background-image:
    radial-gradient(circle at 14% 48%,rgba(255,255,255,.38) 0 .8px,transparent 1.4px),
    radial-gradient(circle at 36% 12%,rgba(205,225,255,.34) 0 .8px,transparent 1.3px),
    radial-gradient(circle at 58% 82%,rgba(255,255,255,.32) 0 .8px,transparent 1.3px),
    radial-gradient(circle at 77% 42%,rgba(210,230,255,.30) 0 .8px,transparent 1.3px);
  background-size:100% 100%;
  animation:skyDriftB 260s linear infinite;
}
@keyframes skyDriftA{from{transform:translate3d(0,0,0)}to{transform:translate3d(18px,-9px,0)}}
@keyframes skyDriftB{from{transform:translate3d(0,0,0)}to{transform:translate3d(-13px,7px,0)}}
html[data-gradient-night="1"]::before{opacity:.52;}
html[data-gradient-night="1"]::after{opacity:.24;}
html[data-animations="off"]::before,html[data-animations="off"]::after{animation:none;}
/* v7.3.1: don't burn CPU drifting two invisible layers — only animate at night,
   and never when the user asked for reduced motion. */
html:not([data-gradient-night="1"])::before,
html:not([data-gradient-night="1"])::after{animation-play-state:paused;}
@media (prefers-reduced-motion:reduce){
  html::before,html::after{animation:none;}
}
body{
  width:calc(100% / var(--ui-scale)); height:calc(100% / var(--ui-scale));
  background:transparent; color:var(--fg);
  font-family:"Inter Tight","IBM Plex Sans Arabic","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:1rem; font-weight:var(--fw,400);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum 1,""cv05" 1;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none; touch-action:none;
  zoom:var(--ui-scale);
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
input,textarea,select,pre,code,.gate-setup,.wz-signed,.wz-ex-sub{
  -webkit-user-select:text; user-select:text;
}
:lang(ar), .rtl{ font-family:"IBM Plex Sans Arabic","Inter Tight",sans-serif; }
button,input,select,textarea{font:inherit; color:inherit; background:none; border:none; outline:none;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--fg); outline-offset:3px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){ :root{--speed:0.001;} }

/* ---------------------------------------------------------------
   SHELL
   --------------------------------------------------------------- */
#app{position:fixed; inset:0; display:flex; flex-direction:column;}

#topbar{
  flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between;
  padding:18px 26px 0; font-size:.8rem; letter-spacing:.01em; color:var(--fg-mid);
  z-index:40; pointer-events:none;
}
#topbar .tb-date{font-weight:400;}
#topbar .tb-clock{font-weight:500; color:var(--fg); font-size:.95rem;}
#topbar .tb-sync{font-size:.68rem; color:var(--fg-faint); margin-left:10px; display:flex; align-items:center; gap:6px;}
.sync-spin{display:none; flex:0 0 auto; width:9px; height:9px; border-radius:50%; border:1.5px solid currentColor; border-top-color:transparent; opacity:.8; animation:syncSpin .8s linear infinite;}
.tb-sync.busy .sync-spin{display:inline-block;}
:root[data-animations="off"] .sync-spin{animation:none;}
@keyframes syncSpin{to{transform:rotate(360deg);}}

#viewport{flex:1 1 auto; position:relative; overflow:hidden;}
#track{
  position:absolute; inset:0; display:flex;
  transition:transform calc(.55s * var(--speed)) var(--ease);
  will-change:transform;
}
.screen{
  flex:0 0 100%; width:100%; height:100%; position:relative;
  display:flex; flex-direction:column; padding:8px 26px 0;
  overflow:hidden;
}
.screen-scroll{overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; padding-bottom:20px;}

#dots{
  flex:0 0 auto; display:flex; gap:7px; justify-content:center; align-items:center;
  padding:12px 0 6px; z-index:30;
}
#dots i{
  width:5px; height:5px; border-radius:50%; background:var(--fg-faint); display:block;
  transition:background calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease);
}
#dots i.on{background:var(--fg); transform:scale(1.35);}

#ticker{
  flex:0 0 auto; min-height:38px; display:flex; align-items:center; justify-content:center;
  padding:0 26px 16px; font-size:.82rem; color:var(--fg-mid); text-align:center;
  opacity:0; transform:translateY(6px);
  transition:opacity calc(.5s * var(--speed)) var(--ease), transform calc(.5s * var(--speed)) var(--ease);
}
#ticker.show{opacity:1; transform:none;}
#ticker b{font-weight:500; color:var(--fg);}

/* ---------------------------------------------------------------
   HOME / COUNTDOWN
   --------------------------------------------------------------- */
.home-wrap{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:34px; min-height:0;}

.count{display:flex; align-items:flex-start; justify-content:center; gap:clamp(18px,4vw,52px);}
.count-unit{display:flex; flex-direction:column; align-items:center; gap:6px;}
.count-num{
  display:flex; font-weight:200; line-height:1;
  font-size:clamp(3.4rem,13vw,8.5rem); letter-spacing:-.045em;
  color:var(--fg); transition:color calc(.8s * var(--speed)) var(--ease);
}
.count-label{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; font-weight:400;}
.count.urgent .count-num{color:var(--accent);}

.digit{display:block; height:var(--dh); overflow:hidden; width:.60em;}
.digit .col{display:block; transition:transform calc(.75s * var(--speed)) var(--ease); will-change:transform;}
.digit .col span{display:block; height:var(--dh); line-height:var(--dh);}
.count-sep{width:.26em;}

.slot{border-top:1px solid var(--line); padding-top:18px; min-height:0; display:flex; flex-direction:column;}
.slot-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  font-size:.74rem; color:var(--fg-soft); margin-bottom:12px;
}
.slot-head .sh-r{color:var(--fg-faint);}
.slot-body{overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; min-height:0;}

.row{
  display:flex; align-items:center; gap:14px; padding:9px 0;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row-time{font-size:.8rem; color:var(--fg-soft); flex:0 0 96px; font-variant-numeric:tabular-nums;}
.row-main{flex:1 1 auto; min-width:0;}
.row-title{font-size:.98rem; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-sub{font-size:.74rem; color:var(--fg-soft); margin-top:2px;}
.row-tag{
  flex:0 0 auto; font-size:.68rem; color:var(--fg-mid);
  border:1px solid var(--line-strong); border-radius:99px; padding:2px 9px;
}
.row.now{position:relative;}
.row.now::before{
  content:""; position:absolute; left:-14px; top:50%; width:4px; height:4px;
  border-radius:50%; background:var(--accent); transform:translateY(-50%);
}
.row.tutor .row-tag{border-color:var(--fg); color:var(--fg);}

.todo{display:flex; align-items:flex-start; gap:13px; padding:14px 16px; margin-bottom:12px;
  border:1px solid var(--line); border-radius:var(--radius); cursor:pointer;}
.todo:last-child{margin-bottom:0;}
.todo.gone{visibility:hidden;}
.todo-badge{
  flex:0 0 auto; font-size:.65rem; font-weight:500; letter-spacing:.02em;
  padding:2px 8px; border-radius:99px; margin-top:2px;
  background:color-mix(in srgb, var(--badge-c) 16%, var(--bg)); color:var(--badge-t, var(--badge-c));
}
.todo-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.box{
  flex:0 0 auto; width:17px; height:17px; border:1.5px solid var(--fg-faint); border-radius:5px;
  margin-top:2px; position:relative;
  transition:border-color calc(.3s * var(--speed)) var(--ease), background calc(.3s * var(--speed)) var(--ease);
}
.box svg{position:absolute; inset:2px; stroke:var(--bg); stroke-width:2.6; fill:none;
  stroke-dasharray:14; stroke-dashoffset:14;
  transition:stroke-dashoffset calc(.35s * var(--speed)) var(--ease);}
.todo.done .box{background:var(--ok); border-color:var(--ok);}
.todo.done .box svg{stroke-dashoffset:0;}
.todo-main{flex:1 1 auto; min-width:0;}
.todo-title{font-size:.96rem; transition:color calc(.3s * var(--speed)) var(--ease);}
.todo.done .todo-title{color:var(--fg-faint); text-decoration:line-through; text-decoration-thickness:1px;}
.todo-meta{font-size:.72rem; color:var(--fg-soft); margin-top:3px;}
.todo-meta .dot{margin:0 6px; color:var(--fg-faint);}
.todo.overdue .todo-meta{color:var(--accent);}

.empty{padding:26px 0; text-align:center; color:var(--fg-soft); font-size:.86rem;}
.empty span{display:block; margin-top:6px; font-size:.75rem; color:var(--fg-faint);}

/* ---------------------------------------------------------------
   CALENDAR
   --------------------------------------------------------------- */
.cal-head{display:flex; align-items:baseline; justify-content:space-between; padding:10px 0 16px;}
.cal-title{font-size:1.15rem; font-weight:400;}
.cal-nav{display:flex; gap:4px; align-items:center;}
.cal-nav button{padding:5px 11px; font-size:.78rem; color:var(--fg-mid); border-radius:var(--radius);}
.cal-nav button:hover{background:var(--field);}

.cal-grid{display:flex; flex-direction:column; flex:1 1 auto; min-height:0; overflow:hidden;}
.tg-head{display:grid; grid-template-columns:44px repeat(7,1fr); flex:0 0 auto; border-bottom:1px solid var(--line); padding-bottom:8px;}
.tg-headcell{text-align:center; padding-top:2px;}
.tg-headcell .cd-name{font-size:.68rem; color:var(--fg-soft); letter-spacing:.05em; display:block;}
.tg-headcell .cd-num{font-size:.85rem; color:var(--fg-mid); margin-top:2px;}
.tg-headcell.today .cd-name{color:var(--fg); font-weight:500;}
.tg-headcell.today .cd-num{color:var(--fg); font-weight:500;}
.tg-headcell{position:relative;}
.tg-scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; touch-action:pan-x pan-y; overscroll-behavior:contain;}
.tg-inner{display:grid; grid-template-columns:44px repeat(7,1fr); position:relative;}
.tg-hourlabels{display:flex; flex-direction:column;}
.tg-hourlabel{font-size:.6rem; color:var(--fg-faint); text-align:right; padding-right:8px; position:relative; top:-6px; white-space:nowrap;}
.tg-col{position:relative; border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hourpx));}
.tg-col.off{background-color:var(--field);}
.tg-block{
  position:absolute; left:3px; right:3px; border-radius:6px; overflow:hidden;
  background:color-mix(in srgb, var(--sub-c,var(--bg)) 16%, var(--bg));
  border:1px solid color-mix(in srgb, var(--sub-c,var(--bg)) 40%, var(--line-strong));
  font-size:.66rem; line-height:1.35; padding:4px 7px;
}
.tg-block .tg-sub{font-weight:500;}
.tg-block .tg-t{color:var(--fg-mid); font-size:.62rem;}
.tg-block.tutor{border-color:var(--fg); background:color-mix(in srgb, var(--sub-c,var(--bg)) 10%, var(--bg)); box-shadow:inset 2px 0 0 var(--fg);}

@media (max-width:760px){
  .tg-scroll{overflow-x:auto;}
  .tg-head, .tg-inner{grid-template-columns:36px repeat(7,84px); min-width:640px;}
}

/* ---------------------------------------------------------------
   STOPWATCH / TIMER
   --------------------------------------------------------------- */
.tool{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; min-height:0;}
.tool-label{font-size:.72rem; color:var(--fg-soft); letter-spacing:.09em;}
.tool-time{
  font-size:clamp(3rem,11vw,6.6rem); font-weight:200; letter-spacing:-.04em; line-height:1;
  transition:color calc(.4s * var(--speed)) var(--ease);
}
.tool-time .ms{font-size:.42em; color:var(--fg-soft); letter-spacing:-.02em;}
.tool-time.fire{color:var(--accent);}
.tool-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.btn{
  border:1px solid var(--line-strong); border-radius:99px; padding:9px 24px; font-size:.84rem;
  color:var(--fg-mid);
  transition:border-color calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;
}
.btn:hover{border-color:var(--fg); color:var(--fg);}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg);}
.btn.primary:hover{opacity:.85;}
.btn.small{padding:6px 15px; font-size:.76rem;}
.btn.danger{color:var(--accent);}
.btn.danger:hover{border-color:var(--accent);}
.presets{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:460px;}
.preset{border:1px solid var(--line); border-radius:99px; padding:6px 15px; font-size:.78rem; color:var(--fg-mid); position:relative;
  transition:border-color calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;}
.preset:hover{border-color:var(--fg-soft); color:var(--fg);}
.preset:active{transform:scale(.95);}
.laps{max-height:150px; overflow-y:auto; touch-action:pan-y; width:min(340px,80vw); border-top:1px solid var(--line);}
.lap{display:flex; justify-content:space-between; padding:7px 0; font-size:.8rem; color:var(--fg-mid); border-bottom:1px solid var(--line);}
.lap span:first-child{color:var(--fg-soft); font-size:.72rem;}

/* ---------------------------------------------------------------
   SHEETS / PANELS
   --------------------------------------------------------------- */
.scrim{
  position:fixed; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; z-index:60;
  transition:opacity calc(.4s * var(--speed)) var(--ease);
}
.scrim.on{opacity:1; pointer-events:auto;}

.sheet{
  position:fixed; left:50%; bottom:0; width:min(520px,100%); max-height:92vh; z-index:76;
  background:var(--bg); border-radius:18px 18px 0 0;
  border:1px solid var(--line); border-bottom:none;
  transform:translate(-50%,102%);
  transition:transform calc(.5s * var(--speed)) var(--ease);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 -8px 40px rgba(0,0,0,.07);
}
.sheet.on{transform:translate(-50%,0);}

#qaSheet{
  left:0; bottom:0; width:100%; height:100%; max-height:none;
  border-radius:0; border:none;
  transform:translateY(100%);
}
#qaSheet.on{transform:translateY(0);}
#qaSheet .sheet-grip{display:none;}
#qaSheet .sheet-head{
  padding:calc(16px + env(safe-area-inset-top,0px)) 22px 12px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between;
}
#qaSheet .qa-clock{font-size:.82rem; color:var(--fg-mid); display:flex; gap:10px; align-items:baseline;}
#qaSheet .qa-clock b{color:var(--fg); font-weight:500;}
#qaSheet .sheet-body{flex:1 1 auto; max-width:640px; width:100%; margin:0 auto; padding:18px 22px calc(22px + env(safe-area-inset-bottom,0px));}
.sheet-grip{width:34px; height:3px; border-radius:99px; background:var(--fg-faint); margin:10px auto 0; flex:0 0 auto;}
.sheet-head{padding:14px 22px 10px; display:flex; align-items:baseline; justify-content:space-between; flex:0 0 auto;}
.sheet-title{font-size:1.02rem; font-weight:400;}
.sheet-body{padding:6px 22px 22px; overflow-y:auto; touch-action:pan-y; flex:1 1 auto;}

.panel{
  position:fixed; top:0; right:0; height:100%; width:min(430px,100%); z-index:70;
  background:var(--bg); border-left:1px solid var(--line);
  transform:translateX(102%);
  transition:transform calc(.5s * var(--speed)) var(--ease);
  display:flex; flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.07);
}
.panel.on{transform:none;}
.panel-head{padding:20px 22px 12px; display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); flex:0 0 auto;}
.panel-body{padding:4px 22px 40px; overflow-y:auto; touch-action:pan-y; flex:1 1 auto;}
.x{font-size:.8rem; color:var(--fg-soft); padding:4px 8px; border-radius:6px;}
.x:hover{color:var(--fg); background:var(--field);}
/* ===== v7.4: settings as an iPhone-style list ===== */
.panel-head{align-items:center; gap:10px;}
.st-back{display:none; align-items:center; gap:2px; padding-left:2px;}
.st-back::before{content:""; width:7px; height:7px; border-left:1.6px solid currentColor; border-bottom:1.6px solid currentColor; transform:rotate(45deg); margin:0 5px 0 4px;}
.panel.sub .st-back{display:inline-flex;}
.panel.sub #stTitle{flex:1 1 auto; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#stPanel .panel-body{padding-top:14px;}
.st-page{animation:stIn calc(.38s * var(--speed)) var(--ease) both;}
.st-page.back{animation-name:stInBack;}
.st-page.still{animation:none;}
@keyframes stIn{from{opacity:0; transform:translateX(26px);} to{opacity:1; transform:none;}}
@keyframes stInBack{from{opacity:0; transform:translateX(-26px);} to{opacity:1; transform:none;}}
.st-page > .sect:first-child{margin-top:4px;}
.st-page > .sect.solo > h3{display:none;}
.st-profile{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:16px 16px; border:1px solid var(--line); border-radius:16px; background:var(--field); transition:transform calc(.15s * var(--speed)) var(--ease), border-color calc(.25s * var(--speed)) var(--ease);}
.st-profile:hover{border-color:var(--fg-faint);}
.st-profile:active{transform:scale(.985);}
.st-avatar{flex:0 0 auto; width:54px; height:54px; border-radius:99px; background:var(--fg); color:var(--bg); display:flex; align-items:center; justify-content:center; font-size:1.15rem; letter-spacing:.02em;}
.st-avatar.big{width:64px; height:64px; margin:6px 0 12px; font-size:1.3rem;}
.st-pmain{flex:1 1 auto; min-width:0;}
.st-pname{font-size:1.2rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.st-psub{font-size:.76rem; color:var(--fg-soft); margin-top:4px;}
.st-group{margin-top:16px; border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.st-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); transition:background calc(.2s * var(--speed)) var(--ease);}
.st-row:last-child{border-bottom:0;}
.st-row:hover{background:var(--field);}
.st-row:active{background:var(--field); transform:scale(.99);}
.st-ico{flex:0 0 auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--field); display:flex; align-items:center; justify-content:center;}
.st-ico-img{width:18px; height:18px; display:block;}
.st-rt{flex:1 1 auto; min-width:0; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.st-rv{flex:0 1 auto; max-width:42%; font-size:.78rem; color:var(--fg-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.st-chev{flex:0 0 auto; width:7px; height:7px; border-right:1.5px solid var(--fg-faint); border-top:1.5px solid var(--fg-faint); transform:rotate(45deg); margin:0 3px 0 2px;}
.st-profile:focus-visible,.st-row:focus-visible,.item-btn:focus-visible,.btn:focus-visible{outline:2px solid var(--fg-faint); outline-offset:2px;}
:root[data-theme="dark"] .st-ico-img, :root[data-gradient-night="1"] .st-ico-img,
:root[data-theme="dark"] .wz-icon, :root[data-gradient-night="1"] .wz-icon,
:root[data-theme="dark"] .au-icon, :root[data-gradient-night="1"] .au-icon{filter:invert(1);}
@media (prefers-color-scheme: dark){ :root:not([data-theme]) .st-ico-img, :root:not([data-theme]) .wz-icon, :root:not([data-theme]) .au-icon{filter:invert(1);} }
.pq-h{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; margin:2px 0 8px;}
.pq-sum,.pq-empty{font-size:.8rem; color:var(--fg-soft);}
.pq-item{align-items:center;}
.pq-thumb{flex:0 0 auto; width:42px; height:42px; border-radius:8px; overflow:hidden; background:var(--field); border:1px solid var(--line);}
.pq-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.pq-item .pq-st{white-space:normal; overflow:visible; text-overflow:clip;}
.pq-st.bad{color:var(--accent);}
.pq-wrap{margin-bottom:22px;}
.tb-sync.tap{cursor:pointer; text-decoration:underline; text-underline-offset:3px;}
.toast-act{margin-left:14px; text-decoration:underline; text-underline-offset:3px; color:inherit; font:inherit; pointer-events:auto;}
.td-photo img,.pv-thumb img{opacity:0; transition:opacity calc(.35s * var(--speed)) var(--ease);}
.td-photo img.loaded,.pv-thumb img.loaded{opacity:1;}
.item-btn:active,.chip:active{transform:scale(.94);}
.pill-extra{white-space:nowrap;}
.extra-toggle{display:block; margin:12px auto 4px; padding:6px 12px; font-size:.74rem; color:var(--fg-soft); letter-spacing:.02em; transition:color calc(.2s * var(--speed)) var(--ease);}
.extra-toggle:hover{color:var(--fg);}
.extra-wrap{display:grid; grid-template-rows:0fr; opacity:0; visibility:hidden;
  transition:grid-template-rows calc(.38s * var(--speed)) var(--ease), opacity calc(.3s * var(--speed)) var(--ease), visibility 0s linear calc(.38s * var(--speed));}
.extra-wrap.open{grid-template-rows:1fr; opacity:1; visibility:visible; transition-delay:0s;}
.extra-inner{overflow:hidden; min-height:0;}
/* v7.4.2: a sheet opened from Settings dims the panel too and sits above it */
body:has(#stPanel.on):has(#edSheet.on) #scrim{z-index:72;}
button{-webkit-tap-highlight-color:transparent;}


/* form bits */
.f{margin-bottom:15px;}
.f > label{display:block; font-size:.72rem; color:var(--fg-soft); margin-bottom:6px; letter-spacing:.02em;}
.f input[type=text], .f input[type=password], .f input[type=email], .f input[type=date], .f input[type=time], .f input[type=number], .f select, .f textarea{
  width:100%; background:var(--field); border:1px solid transparent; border-radius:var(--radius);
  padding:11px 13px; font-size:.92rem;
  transition:border-color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease);
}
.f input:focus, .f select:focus, .f textarea:focus{border-color:var(--fg-faint); background:var(--bg);}
.f select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--fg-soft) 50%),linear-gradient(135deg,var(--fg-soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px;}
.f-row{display:flex; gap:10px;}
.f-row > *{flex:1 1 0; min-width:0;}
.f-hint{font-size:.71rem; color:var(--fg-soft); margin-top:5px; line-height:1.45;}
.f-actions{display:flex; gap:9px; margin-top:20px;}
.f-actions .btn{flex:1 1 auto; text-align:center;}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{border:1px solid var(--line-strong); border-radius:99px; padding:6px 13px; font-size:.79rem; color:var(--fg-mid);
  transition:border-color calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg);}
.chip:active{transform:scale(.95);}
.switch{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.switch:last-child{border-bottom:none;}
.switch-t{font-size:.9rem;}
.switch-d{font-size:.71rem; color:var(--fg-soft); margin-top:3px; max-width:88%; line-height:1.4;}
.track{flex:0 0 auto; width:38px; height:22px; border-radius:99px; background:var(--fg-faint); position:relative; transition:background calc(.3s * var(--speed)) var(--ease);}
.track i{position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:99px; background:var(--bg); transition:transform calc(.3s * var(--speed)) var(--ease);}
.switch.on .track{background:var(--fg);}
.switch.on .track i{transform:translateX(16px);}

.sect{margin:26px 0 0;}
.sect > h3{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; margin-bottom:10px; font-weight:400;}
.sect-list{border-top:1px solid var(--line);}
.item{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line);}
.item-main{flex:1 1 auto; min-width:0;}
.item-t{font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-d{font-size:.71rem; color:var(--fg-soft); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-btn{flex:0 0 auto; font-size:.74rem; color:var(--fg-soft); padding:5px 9px; border-radius:6px;}
.item-btn:hover{background:var(--field); color:var(--fg);}
.item-btn.danger:hover{color:var(--accent);}
.swatch{flex:0 0 auto; width:11px; height:11px; border-radius:3px; border:1px solid var(--line-strong);}
.add-line{display:flex; gap:8px; margin-top:12px;}
.add-line input{flex:1 1 auto;}
.add-line .btn{flex:0 0 auto;}

/* colour field */
.cf{display:flex; gap:8px; align-items:stretch;}
.cf input[type=text]{flex:1 1 auto; min-width:0;}
.cf input[type=color]{
  flex:0 0 46px; width:46px; padding:0;
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--field); cursor:pointer;
}
.cf input[type=color]::-webkit-color-swatch-wrapper{padding:3px;}
.cf input[type=color]::-webkit-color-swatch{border:none; border-radius:calc(var(--radius) - 3px);}
.cf input[type=color]::-moz-color-swatch{border:none; border-radius:calc(var(--radius) - 3px);}

/* ---------------------------------------------------------------
   EDIT MODE
   --------------------------------------------------------------- */
#editbar{
  position:fixed; left:50%; bottom:20px; transform:translate(-50%,calc(100% + 30px)); z-index:55;
  background:var(--fg); color:var(--bg); border-radius:99px; padding:9px 10px 9px 18px;
  display:flex; align-items:center; gap:12px; font-size:.79rem;
  transition:transform calc(.45s * var(--speed)) var(--ease);
  box-shadow:0 6px 26px rgba(0,0,0,.16);
}
#editbar.on{transform:translate(-50%,0);}
#editbar button{background:var(--bg); color:var(--fg); border-radius:99px; padding:5px 13px; font-size:.76rem;}

.gear{
  position:absolute; z-index:20; width:22px; height:22px; border-radius:50%;
  background:var(--bg); border:1px solid var(--line-strong);
  display:none; align-items:center; justify-content:center;
  opacity:0; transform:scale(.7);
  transition:opacity calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease), border-color calc(.2s * var(--speed)) var(--ease);
}
.gear svg{width:12px; height:12px; stroke:var(--fg-mid); fill:none; stroke-width:1.7;}
.gear:hover{border-color:var(--fg);}
.gear:hover svg{stroke:var(--fg);}
body.edit .gear{display:flex; opacity:1; transform:none;}
body.edit .editable{position:relative;}
body.edit .editable::after{
  content:""; position:absolute; inset:-5px -8px; border:1px dashed var(--fg-faint);
  border-radius:8px; pointer-events:none;
}
.gear.g-tr{top:-9px; right:-9px;}
.gear.g-inline{position:static; margin-left:6px; flex:0 0 auto;}

#toast{
  position:fixed; left:50%; bottom:74px; transform:translate(-50%,20px); z-index:90;
  background:var(--fg); color:var(--bg); font-size:.79rem; padding:9px 17px; border-radius:99px;
  opacity:0; pointer-events:none;
  transition:opacity calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease);
}
#toast.on{opacity:1; transform:translate(-50%,0);}
.range-wrap{
  display:flex; align-items:center; gap:12px; width:100%;
  background:var(--field); border-radius:var(--radius); padding:10px 13px;
}
.f input[type=range]{
  flex:1 1 auto; width:100%; padding:0; accent-color:var(--fg);
}
.range-val{
  flex:0 0 48px; text-align:right; font-size:.72rem; color:var(--fg-soft);
}

.hint-up{
  position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
  font-size:.7rem; color:var(--fg-faint); display:flex; align-items:center; gap:6px;
  pointer-events:none;
}

/* ---------------------------------------------------------------
   AUTH GATE / SETUP NOTICE  (macOS-style card)
   --------------------------------------------------------------- */
#gate{
  position:fixed; inset:0; z-index:200;
  background:color-mix(in srgb, var(--field) 55%, var(--bg));
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#gate.hidden{display:none;}
.gate-card{
  width:min(440px,100%);
  background:var(--bg); border:1px solid var(--line); border-radius:20px;
  padding:28px; box-shadow:0 18px 60px rgba(0,0,0,.14);
  animation:auRise calc(.35s * var(--speed)) var(--ease);
}
.gate-err{font-size:.78rem; color:var(--accent); min-height:1.2em; margin-top:10px;}
.gate-setup{
  width:min(540px,100%); font-size:.86rem; line-height:1.7; color:var(--fg-mid);
  background:var(--bg); border:1px solid var(--line); border-radius:20px;
  padding:28px; box-shadow:0 18px 60px rgba(0,0,0,.14);
  overflow-y:auto; touch-action:pan-y; max-height:calc(100vh - 48px);
  animation:auRise calc(.35s * var(--speed)) var(--ease);
}
.gate-setup h1{font-size:1.15rem; font-weight:400; color:var(--fg); margin-bottom:14px;}
.gate-setup ol{padding-left:1.15em; margin:12px 0;}
.gate-setup code{background:var(--field); padding:1px 6px; border-radius:4px; font-size:.85em;}
.gate-setup pre{background:var(--field); border-radius:var(--radius); padding:14px; font-size:.76rem;
  overflow-x:auto; white-space:pre; margin:12px 0; line-height:1.5;}
/* ---------------------------------------------------------------
   NEW: phase-block editor
   --------------------------------------------------------------- */
.phase-blocks{display:flex; flex-direction:column; gap:6px; margin:6px 0;}
.phase-block{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:var(--radius); padding:7px 9px;}
.phase-block .phase-label{flex:1 1 auto; font-size:.82rem; background:none; border:none;}
.phase-pct{font-size:.72rem; color:var(--fg-soft); flex:0 0 auto;}
.phase-rm{flex:0 0 auto; color:var(--fg-faint); font-size:.8rem; padding:2px 6px;}
.phase-rm:hover{color:var(--accent);}

/* ---------------------------------------------------------------
   NEW: subject-tinted task cards + colored custom dropdowns
   --------------------------------------------------------------- */
.todo{ background:color-mix(in srgb, var(--card-c,var(--bg)) 9%, var(--bg)); position:relative; }
.todo.done .todo-title{ text-decoration:line-through; }

.csel{position:relative;}
.csel-btn{width:100%; text-align:left; display:flex; align-items:center; gap:8px; padding:9px 11px;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); cursor:pointer;}
.csel-dot{width:10px; height:10px; border-radius:99px; flex:0 0 auto; background:var(--dot-c,var(--fg-faint));}
.csel-pop{position:absolute; z-index:40; top:calc(100% + 4px); left:0; right:0; max-height:260px; overflow-y:auto; touch-action:pan-y;
  background:var(--bg); border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:0 6px 24px rgba(0,0,0,.14);}
.csel-opt{display:flex; align-items:center; gap:9px; padding:9px 11px; cursor:pointer; font-size:.86rem;
  background:color-mix(in srgb, var(--opt-c,transparent) 12%, var(--bg));}
.csel-opt:hover{background:color-mix(in srgb, var(--opt-c,transparent) 22%, var(--bg));}
.csel-opt .csel-dot{background:var(--opt-c,var(--fg-faint));}

.method-info{margin:8px 0 2px; padding:10px 12px; border-radius:var(--radius);
  border:1.5px dashed var(--info-c,var(--line-strong));
  background:color-mix(in srgb, var(--info-c,transparent) 10%, var(--bg));
  font-size:.78rem; color:var(--fg-mid); line-height:1.4;}

/* ---------------------------------------------------------------
   TASK DETAIL / RAPIDFIRE — the expanding card (FLIP)
   --------------------------------------------------------------- */
#taskDetail,#rfOverlay{
  position:fixed; inset:0; z-index:62; display:flex; align-items:center; justify-content:center;
  pointer-events:none; visibility:hidden;
  background:rgba(0,0,0,0);
  transition:background calc(.3s * var(--speed)) ease;
}
#taskDetail.on,#rfOverlay.on{
  pointer-events:auto; visibility:visible;
  background:rgba(0,0,0,.28);
}

.td-card{
  position:relative;
  display:flex; flex-direction:column;
  width:min(96vw,1000px); max-height:90vh; min-height:min(74vh,580px);
  overflow-y:auto; touch-action:pan-y;
  background:color-mix(in srgb, var(--card-c,var(--bg)) 7%, var(--bg));
  border:1px solid var(--line-strong); border-radius:calc(var(--radius) * 1.6);
  padding:26px 28px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 24px 64px rgba(0,0,0,.25);
  transition:transform calc(.3s * var(--speed)) var(--ease), opacity calc(.26s * var(--speed)) ease;
}
.td-card.flip{
  min-height:0; overflow:hidden;
  transition:
    left   calc(.36s * var(--speed)) var(--ease),
    top    calc(.36s * var(--speed)) var(--ease),
    width  calc(.36s * var(--speed)) var(--ease),
    height calc(.36s * var(--speed)) var(--ease);
}
.td-card.zoomout{ transform:scale(1.22); opacity:0; }
.td-card.fadeout{ transform:scale(.97); opacity:0; }

.td-inner{
  flex:1 0 auto;
  max-width:360px;
  transition:opacity calc(.26s * var(--speed)) ease, transform calc(.26s * var(--speed)) ease;
}
.td-card.primed .td-inner{ opacity:0; transform:translateY(6px); pointer-events:none; }
.td-icons{
  position:absolute; top:16px; right:18px; display:flex; gap:8px; z-index:5;
  transition:opacity calc(.26s * var(--speed)) ease;
}
.td-card.primed .td-icons{ opacity:0; pointer-events:none; }
.td-actions{
  display:flex; gap:10px; margin-top:auto; align-self:center; padding-top:18px;
  transition:opacity calc(.26s * var(--speed)) ease;
}
.td-card.primed .td-actions{ opacity:0; pointer-events:none; }
.td-actions .btn{flex:0 0 auto;}

.td-ghost{
  position:absolute; inset:0; display:flex; align-items:flex-start; gap:13px;
  padding:14px 16px; overflow:hidden; pointer-events:none;
  transition:opacity calc(.18s * var(--speed)) ease;
}
.td-ghost.fade{ opacity:0; }
.td-ghost.btnish{
  align-items:center; justify-content:center; padding:0;
  color:var(--fg-mid); font-size:.79rem;
}

.td-badge{font-size:.68rem; padding:2px 9px; border-radius:99px; color:var(--badge-t, var(--badge-c)); background:color-mix(in srgb, var(--badge-c) 16%, var(--bg));}
.td-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.td-title-row .td-title{margin-bottom:0;}
.td-icon{width:30px; height:30px; border-radius:99px; display:flex; align-items:center; justify-content:center; color:var(--fg-mid); border:1px solid var(--line);}
.td-icon.danger{color:#c0392b; border-color:#c0392b55;}
.td-icon svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.td-title{font-size:1.05rem; margin-bottom:4px;}
.td-meta{font-size:.8rem; color:var(--fg-mid); margin-bottom:16px;}
.td-window{font-size:.72rem; color:var(--fg-soft); margin-bottom:14px;}
.td-phases{border-top:1px solid var(--line); padding-top:12px; margin-bottom:4px;}
.td-phase{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:.82rem; border-bottom:1px solid var(--line);}
.td-phase:last-child{border-bottom:none;}
.td-ph-l{flex:1 1 auto; min-width:0; line-height:1.4;}
.td-ph-t{color:var(--fg-soft); flex:0 0 auto; font-variant-numeric:tabular-nums;}

.rf-card{display:flex; flex-direction:column;}
.rf-inner{max-width:none; display:flex; flex-direction:column; flex:1 1 auto; min-height:0;}
.rf-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px;}
.rf-list{flex:1 1 auto; overflow-y:auto; touch-action:pan-y; min-height:0; margin:12px 0 8px; padding-right:4px;}
.rfc.picked .box{background:var(--ok); border-color:var(--ok);}
.rfc.picked .box svg{stroke-dashoffset:0;}
.rfc:not(.picked){opacity:.55;}
.rf-total{font-size:.85rem; color:var(--fg-mid); line-height:1.4; text-align:center; padding:4px 0 2px;}
.rf-btnrow{display:flex; gap:10px; justify-content:center; margin-top:6px;}

@media (max-width:760px){
  .td-inner{max-width:none; padding-right:76px;}
}

/* ---------------------------------------------------------------
   TASK RUN (fullscreen, distraction-free)
   --------------------------------------------------------------- */
#taskRun{
  position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg); opacity:0; pointer-events:none;
  transform:scale(1.12);
  transition:opacity calc(.5s * var(--speed)) var(--ease), transform calc(.5s * var(--speed)) var(--ease);
}
#taskRun.on{ opacity:1; pointer-events:auto; transform:scale(1); }
.tr-task{font-size:.8rem; color:var(--fg-soft); letter-spacing:.02em; margin-bottom:12px;
  max-width:80vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tr-phase{font-size:1.05rem; color:var(--fg-mid); text-align:center; max-width:80vw; margin-bottom:22px;}
.tr-clock{font-size:clamp(3rem,14vw,6.5rem); font-variant-numeric:tabular-nums; letter-spacing:.02em;}
.tr-clock.pulse{animation:trPulse .6s var(--ease);}
@keyframes trPulse{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}
html[data-animations="off"] .tr-clock.pulse{animation:none;}
.tr-next{font-size:.78rem; color:var(--fg-faint); margin-top:14px;}
.tr-btns{display:flex; gap:16px; margin-top:34px;}
.tr-btns button{padding:11px 26px; border-radius:99px; border:1px solid var(--line-strong); font-size:.85rem;}
.tr-btns button.primary{background:var(--fg); color:var(--bg); border-color:var(--fg);}

/* ---------------------------------------------------------------
   ARCHIVE
   --------------------------------------------------------------- */
#archiveScreen{position:fixed; inset:0; z-index:52; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(100%); opacity:0; transition:transform calc(.4s * var(--speed)) var(--ease), opacity calc(.3s * var(--speed)) var(--ease); pointer-events:none;}
#archiveScreen.on{transform:translateY(0); opacity:1; pointer-events:auto;}
.ar-head{display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top,0px)) 22px 10px; border-bottom:1px solid var(--line);}
.ar-filters{display:flex; gap:6px; flex-wrap:wrap;}
.ar-right{display:flex; align-items:center; gap:10px;}
.ar-search{width:170px; background:var(--field); border:1px solid transparent; border-radius:var(--radius); padding:7px 11px; font-size:.8rem;}
.ar-search:focus{border-color:var(--fg-faint); background:var(--bg);}
.ar-body{flex:1 1 auto; overflow-y:auto; touch-action:pan-y; padding:14px 22px 30px;}
.ar-daygroup{margin-bottom:22px;}
.ar-daylabel{font-size:.72rem; color:var(--fg-faint); letter-spacing:.06em; margin-bottom:8px;}
.ar-item{display:flex; align-items:flex-start; gap:12px; padding:12px 14px; margin-bottom:10px;
  border:1px solid var(--line); border-radius:var(--radius); cursor:pointer;
  background:color-mix(in srgb, var(--card-c,var(--bg)) 8%, var(--bg));}
.ar-item:hover{border-color:var(--fg-faint);}
.ar-item .ar-t{font-size:.92rem; overflow:hidden; text-overflow:ellipsis;}
.ar-item.done .ar-t{color:var(--fg-faint); text-decoration:line-through; text-decoration-thickness:1px;}
.ar-item .ar-m{font-size:.72rem; color:var(--fg-soft); margin-top:3px;}
.ar-item.missed .ar-m{color:var(--accent);}
.ar-empty{padding:30px 0; text-align:center; color:var(--fg-soft); font-size:.86rem;}

/* ---------------------------------------------------------------
   CALENDAR TASK BLOCKS (subject fill + finished/overdue stripes)
   --------------------------------------------------------------- */
.tg-task{
  position:absolute; left:3px; right:3px; border-radius:6px; overflow:hidden;
  border:2px solid var(--task-c,var(--line-strong));

/* v7.4.1 NETWORK WATCH — the spinner shows while ANY internet work is in flight (writes,
   photo uploads, the connection check, the first sync). It stays up for a beat after the
   last call ends so very quick calls are still visible, and hides while offline because
   Firestore keeps writes queued then. */
let netBusy=0, netHideT=null, netUp=true, netCheckBusy=false;
// true only inside the packaged Android app (Capacitor serves from a capacitor:// / localhost
// origin, never file://). The browser build keeps pausing on document.hidden as before.
const IN_APK = typeof window!=="undefined" && !!window.Capacitor;
const bgHidden = ()=> !IN_APK && document.hidden;
function netStart(){ netBusy++; clearTimeout(netHideT); paintSync(); }
function netEnd(){ netBusy=Math.max(0,netBusy-1); if(!netBusy){ clearTimeout(netHideT); netHideT=setTimeout(paintSync,450); } }
function netTrack(p){ netStart(); return Promise.resolve(p).finally(netEnd); }
// A no-cors request needs no permission: it settles if Google answers at all, and rejects
// only on a real connection failure. Cheap, and it costs no Firestore reads.
async function netCheck(){
  if(netCheckBusy || bgHidden()) return;
  netCheckBusy=true; netStart();
  let up=navigator.onLine!==false;
  if(up){
    const ac=(typeof AbortController!=="undefined")?new AbortController():null;
    const to=setTimeout(()=>{ try{ if(ac) ac.abort(); }catch(e){} },6000);
    try{ await fetch("https://firestore.googleapis.com/?_="+Date.now(),{mode:"no-cors",cache:"no-store",signal:ac?ac.signal:undefined}); }
    catch(e){ up=false; }
    clearTimeout(to);
  }
  netCheckBusy=false; netEnd();
  netUp=up;
  if(!fsReady) return;
  if(up){
    if(lastSyncTxt==="offline"){ markSync(""); try{ fsDB.enableNetwork(); }catch(e){} }
    photoQueueFlush();
  }else{
    markSync("offline");
  }
}

  if(Date.now()-pqLastTry<secs*1000) return;
  pqLastTry=Date.now();
  photoQueueFlush();
}

async function writeDoc(ref, body){
  const key=ref.path;
  if(writeLocks[key]){ writeLocks[key]=body; return; }
  writeLocks[key]=true;
  try{
    await netTrack(ref.set(body, {merge:false}));
    const queued=writeLocks[key];
    writeLocks[key]=null;
    if(queued && queued!==true) await writeDoc(ref,queued);
  }catch(err){
    writeLocks[key]=null;
    if(err && err.code==="resource-exhausted"){ toast("Firestore's free quota is used up for now."); }
  }
}

  try{
    const pending=await PQ.keys();
    for(const k of pending){
      if(k.split("|")[0]===id) await PQ.del(k);
    }
  }catch(e){}
  if(R2_CONFIGURED && fsUser && t && t.photos && t.photos.length){
    t.photos.forEach(p=>{
      const base="photos/"+fsUser.uid+"/"+id+"/"+p.id;
      photoSend("DELETE",base+".jpg").catch(()=>{});
      photoSend("DELETE",base+"_t.jpg").catch(()=>{});
    });
  }
}

function initSync(){
  try{
    if(!FIREBASE_CONFIGURED){ showGate("setup"); markSync("not connected"); return; }
    if(typeof firebase==="undefined" || !firebase.initializeApp){
      showScriptFailGate(); markSync("offline"); return;
    }

    firebase.initializeApp(FIREBASE_CONFIG);
    fsDB=firebase.firestore();

    const persistenceSettled=Promise.race([
      fsDB.enablePersistence({synchronizeTabs:true}).catch(()=>{}),
      new Promise(res=>setTimeout(res,2000))
    ]);

    firebase.auth().onAuthStateChanged(async user=>{
      teardownListeners();
      if(!user){
        fsUser=null; fsReady=false; markSync("signed out");
        closeAll();
        if(FIREBASE_CONFIGURED) showWizard();
        else showGate("signin");
        return;
      }
      fsUser=user; fsReady=true; hideGate(); markSync("");
      await persistenceSettled;
      attachListeners();
      registerDevice(true);   // v7.4
      photoQueueFlush();      // v7.3: retry any photos taken offline
    });

    window.addEventListener("online", ()=>{
      if(fsReady) markSync("");
      photoQueueFlush();      // v7.3
    });
    window.addEventListener("offline", ()=>{ if(fsReady) markSync("offline"); });
  }catch(err){
    showScriptFailGate();
    markSync("offline");
  }
}

function attachListeners(){
  ["settings","taxonomy","schedule"].forEach(which=>{
    const un=configDoc(which).onSnapshot(snap=>{
      if(!snap.exists) return;
      const d=snap.data();
      if(!d || typeof d.updatedAt!=="number") return;
      if(d.updatedAt <= (State._v[which]||0)) return;
      State._v[which]=d.updatedAt;
      if(which==="settings") Object.assign(State.settings, d.payload||{});
      else if(which==="taxonomy") State.taxonomy=mergeTaxonomy(d.payload);
      else{
        State[which]=d.payload||State[which];
        if(which==="schedule") normalizeSchedule();
      }
      saveLocal(); applyTokens(); renderAll();
      if(WIZ.active) wizRerender();
      markSync(snap.metadata.fromCache?"offline":"");
    }, err=>{ markSync("offline"); });
    liveUnsubs.push(un);
  });

  pqKickDone=false;
  netStart(); let netAttachDone=false;
  const netAttachEnd=()=>{ if(!netAttachDone){ netAttachDone=true; netEnd(); } };
  setTimeout(netAttachEnd,8000);
  const un2=todosCol().onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const d=ch.doc.data();
      if(ch.type==="removed"){ delete State.todos[ch.doc.id]; }
      else if(d && d.id){
        const cur=State.todos[d.id];
        if(!cur || (d.updatedAt||0) >= (cur.updatedAt||0)) State.todos[d.id]=d;
      }
    });
    saveLocal(); renderAll();
    markSync(snap.metadata.fromCache?"offline":"");
    if(!pqKickDone){ pqKickDone=true; photoQueueFlush(); }   // v7.4: orphan check needs tasks loaded
    netAttachEnd();
  }, err=>{ markSync("offline"); netAttachEnd(); });
  liveUnsubs.push(un2);

  configDoc("settings").get().then(s=>{
    if(!s.exists){ pushConfig("settings"); pushConfig("taxonomy"); pushConfig("schedule"); }
  }).catch(()=>{});
}

const METHOD_BADGE_PALETTE=["#8a5a2b","#2b6e8a","#5a7d2b","#7d2b6e","#2b5a7d","#8a2b3f","#3f7d58","#6e5a2b"];
function methodBadgePalette(){ return METHOD_BADGE_PALETTE; }
// v7.3.1: the palette is keyed off a stable slot stored on the method the first
// time it's drawn, so removing one method no longer recolours all the others
const METHOD_BADGE_SLOT="__slot";
function methodColor(id){
  const list=State.taxonomy.methods, i=list.findIndex(m=>m.id===id);
  if(i<0) return METHOD_BADGE_PALETTE[0];
  const m=list[i];
  if(m.color) return m.color;
  if(m[METHOD_BADGE_SLOT]==null){
    const used=list.map(x=>x[METHOD_BADGE_SLOT]).filter(v=>v!=null);
    let slot=0;
    while(used.indexOf(slot)>=0 && slot<methodBadgePalette().length-1) slot++;
    m[METHOD_BADGE_SLOT]=slot;
  }
  return methodBadgePalette()[m[METHOD_BADGE_SLOT]%methodBadgePalette().length];
}
const methodById  = id => State.taxonomy.methods.find(m=>m.id===id);
const subjectColor = id => (subjectById(id)||{}).color || "#8a8a8a";
const subjectWeight = id => (subjectById(id)||{}).weight || 1;
function taskColor(t){ return t.method ? methodColor(t.method) : subjectColor(t.subject); }

function effBgHex(){
  try{
    const v=(getComputedStyle(document.documentElement).getPropertyValue("--bg")||"").trim();
    if(/^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(v)) return v.toLowerCase();
  }catch(e){}
  return effTheme()==="dark" ? "#111111" : "#ffffff";
}
function inkFor(colorHex,tint){
  try{
    const pillBg=lerpColor(effBgHex(),colorHex,tint);
    if(contrastRatio(colorHex,pillBg)>=4.5) return colorHex;
    const pole=contrastRatio(pillBg,"#2b2b2b")>=contrastRatio(pillBg,"#e4e4e4") ? "#2b2b2b" : "#e4e4e4";
    for(let i=1;i<=10;i++){
      const c=lerpColor(colorHex,pole,i/10);
      if(contrastRatio(c,pillBg)>=4.5) return c;
    }
    return pole;
  }catch(e){ return colorHex; }
}
function setBadge(elm,colorHex){
  elm.style.setProperty("--badge-c",colorHex);
  elm.style.setProperty("--badge-t",inkFor(colorHex,0.16));

function fmtMin(m){ const h=Math.floor(m/60), r=m%60; return h?(h+"h"+(r?" "+r+"m":"")):(m+" min"); }
function fmtHourMin(h,m){
  if(State.settings.clock24!==false) return pad(h)+":"+pad(m);
  const h12=h%12===0?12:h%12;
  return h12+":"+pad(m)+" "+(h<12?"AM":"PM");
}
function fmtClock(d){ return fmtHourMin(d.getHours(),d.getMinutes()); }
function fmtClockMin(m){
  const tot=Math.round(m);
  return fmtHourMin(Math.floor(tot/60)%24, tot%60);
}
function fmtHHMM(hhmm){
  const [h,m]=hhmm.split(":").map(Number);
  return fmtHourMin(h,isNaN(m)?0:m);
}
function fmtSecs(sec){ return sec<60 ? Math.round(sec)+" sec" : fmtMin(Math.round(sec/60)); }

function phasesFor(t){
  const m=methodById(t.method);
  const dur=t.duration||State.settings.defaultDuration||25;
  const raw=(m&&m.phases&&m.phases.length) ? m.phases : [{label:t.title,pct:1}];
  const total=raw.reduce((a,p)=>a+p.pct,0)||1;
  let acc=0; const out=raw.map((p,i)=>{
    const secs = i===raw.length-1
      ? Math.max(15,dur*60-acc)
      : Math.round(dur*60*(p.pct/total)/15)*15;
    acc+=secs;
    return {label:p.label, secs:Math.max(15,secs)};
  });
  return out;
}
function tasksDueOn(dateStr){

}
function dayLoadMinutes(dateStr,excludeId){

}
const subjectName = id => (subjectById(id)||{}).name || "—";
const typeName    = id => (typeById(id)||{}).name || "—";
const methodName  = id => (methodById(id)||{}).name || "";
const isWeekend   = dow => State.settings.weekendDays.indexOf(dow)>=0;
const targetDate  = ()=> new Date(State.settings.targetDate+"T"+State.settings.targetTime+":00");

function sessionsFor(dow){
  const list=(State.schedule.days[dow]||[]).slice();
  list.sort((a,b)=>minOf(a.start)-minOf(b.start));
  return list;
}
function sessionsForDate(d){
  const ex=(State.schedule.exceptions||{})[iso(d)]||[];
  return sessionsFor(d.getDay()).filter(x=>ex.indexOf(x.id)<0);
}
// v7.3.1: sessions already occupy real time, so an evening tutoring slot used to
// sit underneath the first queued tasks. fitStart() walks the cursor forward past
// anything the day already has on it. Pinned tasks (startMin) keep their slot.
function fitStart(start,dur,ranges){
  let changed=true;
  while(changed){
    changed=false;
    for(const r of ranges){
      if(start<r[1] && r[0]<start+dur){ start=Math.max(start,r[1]); changed=true; }
    }
  }
  return start;
}
function dayBlockedRanges(dateStr){
  const d=fromISO(dateStr), ranges=[];
  sessionsForDate(d).forEach(x=>ranges.push([minOf(x.start),minOf(x.end)]));
  return ranges;
}
function dayTaskLayout(dateStr){
  const s=State.settings;
  const anchor=s.calAnchorHour*60;
  const busy=dayBlockedRanges(dateStr).filter(r=>r[1]>anchor);
  let cursor=anchor;
  return sortTodos(todosOn(dateStr)).map(t=>{
    const dur=t.duration||s.defaultDuration||25;
    let start;
    if(t.startMin!=null){
      start=t.startMin;
      // a pinned task blocks the ones queued after it, exactly like a session
      busy.push([start,start+dur]);
    }else{
      start=fitStart(cursor,dur,busy);
      cursor=start+dur;
    }
    return {t,dur,start,end:start+dur};
  });
}
function dayOccupancyMinutes(dateStr){
  const d=fromISO(dateStr);
  let m=0;
  sessionsForDate(d).forEach(x=>{ m+=Math.max(0,minOf(x.end)-minOf(x.start)); });
  dayTaskLayout(dateStr).forEach(l=>{ if(!l.t.archived) m+=l.dur; });
  return m;
}
function missedPool(){
  return todosArray().filter(t=>t.archived && t.missed && !t.done && !t.rescheduled);
}
function todosArray(){ return Object.values(State.todos); }
function todosOn(dateStr){ return todosArray().filter(t=>t.due===dateStr); }
/* v7.4.1 ADDITIONAL TASKS — anything due after today is listed under the day's real tasks with
   a blue pill. Skipping it never archives it (the sweep only looks at due dates in the past),
   and it turns into a normal task the evening before it is due. */
let extraOpen=false;   // v7.4.2: always starts collapsed, even after a refresh (memory only, never saved)
function isAdditional(t,now){
  if(!t || !t.due) return false;
  if(t.seriesId) return false;   // v7.4.2: repeating / spaced tasks are never "additional"
  now=now||new Date();
  if(t.due<=iso(now)) return false;
  const h=State.settings.additionalNight==null?20:State.settings.additionalNight;
  if(t.due===iso(addDays(now,1)) && now.getHours()>=h) return false;
  return true;
}
function sortTodos(list){
  const s=State.settings;
  const arr=list.slice();
  arr.sort((a,b)=>{
    if(s.doneStyle==="bottom" && (!!a.done)!==(!!b.done)) return a.done?1:-1;
    if(s.taskSort==="subject"){ const d=subjectName(a.subject).localeCompare(subjectName(b.subject)); if(d) return d; }
    if(s.taskSort==="type"){ const d=typeName(a.type).localeCompare(typeName(b.type)); if(d) return d; }
    return (a.due||"").localeCompare(b.due||"") || (a.createdAt||0)-(b.createdAt||0);
  });
  return arr;
}

function hexToRgb(hex){
  const h=hex.replace("#","");
  const n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function lerpColor(a,b,t){
  const A=hexToRgb(a), B=hexToRgb(b);
  const c=A.map((v,i)=>Math.round(v+(B[i]-v)*clamp(t,0,1)));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const SUN_COLORS={ night:"#07111f", dawn:"#2e4968", day:"#e9f1f6", dusk:"#3f5877" };
function fallbackSunTimes(base){
  const mk=(h,m)=>{ const d=new Date(base); d.setHours(h,m,0,0); return d; };
  return {civilBegin:mk(5,45), sunrise:mk(6,15), sunset:mk(18,15), civilEnd:mk(18,45)};
}
async function fetchSunTimes(dateISO,lat,lng){
  const cacheKey="bacdash.sun."+lat+","+lng+"."+dateISO;
  try{
    const c=localStorage.getItem(cacheKey);
    if(c) return JSON.parse(c);
  }catch(e){}
  try{
    const res=await fetch("https://api.sunrise-sunset.org/json?lat="+lat+"&lng="+lng+"&date="+dateISO+"&formatted=0");
    const j=await res.json();
    if(j.status!=="OK") throw new Error("bad status");
    const out={civilBegin:j.results.civil_twilight_begin,sunrise:j.results.sunrise,sunset:j.results.sunset,civilEnd:j.results.civil_twilight_end};
    try{ localStorage.setItem(cacheKey,JSON.stringify(out)); }catch(e){}
    return out;
  }catch(e){ return null; }
}
let sunCache=null, sunCacheDate=null, sunFetchInFlight=false;
function ensureSunTimes(){
  const today=iso(new Date());
  if(sunCache && sunCacheDate===today) return;
  if(sunFetchInFlight) return;
  sunFetchInFlight=true;
  const s=State.settings;
  fetchSunTimes(today,s.gradientLat,s.gradientLng).then(r=>{
    sunFetchInFlight=false;
    if(r){
      sunCache={civilBegin:new Date(r.civilBegin), sunrise:new Date(r.sunrise),
        sunset:new Date(r.sunset), civilEnd:new Date(r.civilEnd)};
    }else{ sunCache=fallbackSunTimes(new Date()); }
    sunCacheDate=today;
    if(State.settings.theme==="gradient") updateGradientTheme();
    applyAmbientTint();
  });
}
function updateGradientTheme(){
  if(!sunCache) sunCache=fallbackSunTimes(new Date());
  const now=new Date();
  const {civilBegin,sunrise,sunset,civilEnd}=sunCache;
  const dayMs=86400000;
  const anchors=[
    {t:civilEnd.getTime()-dayMs, c:SUN_COLORS.night},
    {t:civilBegin.getTime(),     c:SUN_COLORS.night},
    {t:sunrise.getTime(),        c:SUN_COLORS.dawn},
    {t:sunrise.getTime()+45*60000, c:SUN_COLORS.day},
    {t:sunset.getTime()-45*60000,  c:SUN_COLORS.day},
    {t:sunset.getTime(),        c:SUN_COLORS.dusk},
    {t:civilEnd.getTime(),      c:SUN_COLORS.night},
    {t:civilBegin.getTime()+dayMs, c:SUN_COLORS.night}
  ];
  const nt=now.getTime();
  let seg=anchors[0];
  for(let i=0;i<anchors.length-1;i++){
    if(nt>=anchors[i].t && nt<anchors[i+1].t){
      applyGradient(lerpColor(anchors[i].c,anchors[i+1].c,(nt-anchors[i].t)/(anchors[i+1].t-anchors[i].t)));
      return;
    }
    seg=anchors[i+1];
  }
  applyGradient(seg.c);
}
function relativeLuminance(hex){
  const rgb=hexToRgb(hex).map(v=>v/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];
}
function contrastRatio(a,b){
  const la=relativeLuminance(a), lb=relativeLuminance(b);
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05);
}
function gradientThemeFor(color){
  return contrastRatio(color,"#2b2b2b") >= contrastRatio(color,"#e4e4e4") ? "light" : "dark";
}
function applyGradient(color){
  const r=document.documentElement;
  r.setAttribute("data-theme",gradientThemeFor(color));
  r.style.backgroundImage="linear-gradient(165deg,"+color+","+lerpColor(color, gradientThemeFor(color)==="dark"?"#02070e":"#f8fbfd", 0.10)+")";
  r.setAttribute("data-gradient-night", gradientThemeFor(color)==="dark" ? "1" : "0");
  gradientColorNow=color;
  applyDynamicText();
}

/* ---------------------------------------------------------------
   AMBIENT DAWN/DUSK TINT
   --------------------------------------------------------------- */
const darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
const AMBIENT_TINTS={
  dawn:{ light:{bg:"#fff3e9", field:"#f9f1ea"}, dark:{bg:"#111521", field:"#161b26"} },
  dusk:{ light:{bg:"#fdeade", field:"#f5ebe3"}, dark:{bg:"#191310", field:"#1e1815"} }
};
let _ambientKey="";
function effTheme(){
  const dt=document.documentElement.getAttribute("data-theme");
  if(dt==="dark") return "dark";
  if(dt==="light") return "light";
  return (darkMQ && darkMQ.matches) ? "dark" : "light";
}
function ambientFactors(){
  if(!sunCache) return null;
  const now=Date.now(), span=75*60000;
  const tri=c=>clamp(1-Math.abs(now-c)/span,0,1);
  return {dawn:tri(sunCache.sunrise.getTime()), dusk:tri(sunCache.sunset.getTime())};
}
function applyAmbientTint(){
  const r=document.documentElement, s=State.settings;
  const key=(sunCacheDate||"-")+"|"+s.theme+"|"+effTheme()+"|"+Math.floor(Date.now()/60000);
  if(key===_ambientKey) return;
  _ambientKey=key;
  const clear=()=>{
    if(r.style.getPropertyValue("--bg")){
      r.style.setProperty("--bg","");
      r.style.setProperty("--field","");
    }
  };
  if(s.theme==="gradient"){ clear(); applyDynamicText(); return; }
  const f=ambientFactors();
  if(!f || (f.dawn<=0 && f.dusk<=0)){ clear(); applyDynamicText(); return; }
  const mode=effTheme()==="dark" ? "dark" : "light";
  const which=f.dawn>=f.dusk ? "dawn" : "dusk";
  const k=Math.max(f.dawn,f.dusk);
  const tints=AMBIENT_TINTS[which][mode];
  r.style.setProperty("--bg", lerpColor(mode==="dark"?"#111111":"#ffffff",tints.bg,k));
  r.style.setProperty("--field", lerpColor(mode==="dark"?"#1b1b1b":"#f6f6f6",tints.field,k));
  applyDynamicText();
}

/* ---------------------------------------------------------------
   DYNAMIC TEXT TOKENS
   --------------------------------------------------------------- */
const STATIC_TOKENS={
  light:{base:"#ffffff", fg:"#2b2b2b", mid:"#6e6e6e", soft:"#9a9a9a", faint:"#c9c9c9"},
  dark: {base:"#111111", fg:"#e4e4e4", mid:"#a0a0a0", soft:"#7a7a7a", faint:"#3d3d3d"}
};
let gradientColorNow=null;
function liveBgHex(){
  if(State.settings.theme==="gradient" && gradientColorNow) return gradientColorNow;
  const v=document.documentElement.style.getPropertyValue("--bg").trim();
  if(/^#([0-9a-f]{6})$/i.test(v)) return v.toLowerCase();
  return STATIC_TOKENS[effTheme()==="dark"?"dark":"light"].base;
}
function applyDynamicText(){
  const r=document.documentElement;
  const bg=liveBgHex();
  const st=STATIC_TOKENS[effTheme()==="dark"?"dark":"light"];
  const pole=contrastRatio(bg,"#1c1c1c")>=contrastRatio(bg,"#f4f4f4") ? "#1c1c1c" : "#f4f4f4";
  const pick=(target)=>{
    for(let i=1;i<=24;i++){
      const c=lerpColor(bg,pole,i/24);
      if(contrastRatio(c,bg)>=target) return c;
    }
    return pole;
  };
  r.style.setProperty("--fg",      pick(Math.max(12,  contrastRatio(st.fg,   st.base))));
  r.style.setProperty("--fg-mid",   pick(Math.max(6,   contrastRatio(st.mid,  st.base))));
  r.style.setProperty("--fg-soft",  pick(Math.max(4.5, contrastRatio(st.soft, st.base))));
  r.style.setProperty("--fg-faint", pick(Math.max(3.4, contrastRatio(st.faint,st.base))));
}

let sweepDay="";

  const today=iso(new Date());

  if(isWeekend(n.getDay()) && s.weekendShowsTasks) return "tasks";
  if(cur>=minOf(s.morningStart) && cur<minOf(s.morningEnd)) return "morning";
  if(cur>=minOf(s.afternoonStart) && cur<minOf(s.afternoonEnd)) return "afternoon";

function renderSlot(){
  const s=State.settings;
  const mode=currentSlot();

  if(mode==="tasks"){
    $("#slotTitle").textContent="Tasks";

      if(t.archived) return false;

    if(!normal.length) body.appendChild(emptyState("Nothing due today.","Additional tasks are tucked away below."));
    sortTodos(normal).forEach(t=> body.appendChild(todoRow(t)));
    if(extra.length){

function renderTicker(){

  const now=new Date();
  let best=null;
  for(let off=0; off<=2; off++){
    const d=addDays(now,off);
    sessionsForDate(d).forEach(x=>{
      if(s.reminderTutoringOnly && x.kind!=="tutoring") return;
      const when=new Date(d.getFullYear(),d.getMonth(),d.getDate(),...x.start.split(":").map(Number));
      const hrs=(when-now)/3600000;
      if(hrs>0 && hrs<=s.reminderLeadHours && (!best||when<best.when)) best={when,x,off};
    });
  }
  if(!best){ box.classList.remove("show"); return; }
  const when = best.off===0?"today":(best.off===1?"tomorrow":DAY_NAMES[best.when.getDay()]);
  box.innerHTML="";
  box.appendChild(document.createTextNode(subjectName(best.x.subject)+" "+(best.x.kind==="tutoring"?"tutoring":"class")+" "+when+" at "));
  box.appendChild(el("b",null,fmtHHMM(best.x.start)));
  box.classList.add("show");
}

      if(end<=winStart || start>=winEnd) return;
      lastBottom=Math.max(lastBottom,end);
      const top=(clamp(start,winStart,winEnd)-winStart)/60*TG_HOUR_PX;
      const h=Math.max(20, Math.min(dur, winEnd-clamp(start,winStart,winEnd))/60*TG_HOUR_PX);
      const over=!t.done && (t.missed || (t.due && t.due<todayStr));
      const blk=el("div","tg-task"+(t.done?" done":"")+(over?" overdue":""));
      blk.style.top=top+"px"; blk.style.height=h+"px";
      blk.style.setProperty("--task-c", subjectColor(t.subject));
      blk.dataset.key="t|"+t.id;
      blk.appendChild(el("div","tg-sub", t.title));
      blk.appendChild(el("div","tg-t", fmtMin(dur)+(t.step?" · "+t.step:"")+(over?" · missed":"")));
      if(editMode) blk.addEventListener("click",ev=>{ ev.stopPropagation(); calToggleEntry(blk); });
      else blk.addEventListener("click",()=>openTaskDetail(t,blk,false,false));
      col.appendChild(blk);
    });
    if(ds>=todayStr && missedPool().length>0 && dayOccupancyMinutes(ds)<ADDMORE_MIN_FREE){
      const chip=el("button","tg-addmore","add more");
      chip.type="button";
      chip.style.top=((clamp(lastBottom,winStart,winEnd-45)-winStart)/60*TG_HOUR_PX)+"px";
      chip.addEventListener("click",ev=>{ ev.stopPropagation(); openAddMore(ds); });
      col.appendChild(chip);
    }
    inner.appendChild(col);
  });
  scroll.appendChild(inner);
  grid.appendChild(scroll);
}

const SW={running:false,base:0,acc:0,laps:[],raf:null};
function swFmt(ms){
  const t=Math.floor(ms/10), cs=t%100;
  return (Math.floor(t/360000)?Math.floor(t/360000)+":":"")+pad(Math.floor(t/6000)%60)+":"+pad(Math.floor(t/100)%60)+'<span class="ms">.'+pad(cs)+"</span>";
}
function swNow(){ return SW.acc + (SW.running?Date.now()-SW.base:0); }
function swPaint(){ $("#swDisplay").innerHTML=swFmt(swNow()); if(SW.running) SW.raf=requestAnimationFrame(swPaint); }
function swToggle(){
  if(SW.running){ SW.acc=swNow(); SW.running=false; cancelAnimationFrame(SW.raf); $("#swStart").textContent="Start"; }
  else{ SW.base=Date.now(); SW.running=true; $("#swStart").textContent="Pause"; swPaint(); }
}
function swResetFn(){ SW.running=false; cancelAnimationFrame(SW.raf); SW.acc=0; SW.laps=[]; $("#swStart").textContent="Start"; swPaint(); swRenderLaps(); }
function swLapFn(){ if(SW.running){ SW.laps.unshift(swNow()); swRenderLaps(); } }
function swRenderLaps(){
  const box=$("#swLaps");
  box.hidden = !State.settings.swLaps || !SW.laps.length;
  box.innerHTML="";
  SW.laps.forEach((l,i)=>{
    const r=el("div","lap");
    r.appendChild(el("span",null,"Lap "+(SW.laps.length-i)));
    const v=el("span"); v.innerHTML=swFmt(l-(SW.laps[i+1]||0)); r.appendChild(v);
    box.appendChild(r);
  });
}
// v7.3.1: `fired` lets Start offer a fresh run instead of doing nothing at 00:00
const TM={running:false,end:0,left:0,dur:0,int:null,fired:false};
function tmFmt(ms){
  const t=Math.ceil(ms/1000);
  return (Math.floor(t/3600)?Math.floor(t/3600)+":"+pad(Math.floor(t/60)%60):String(Math.floor(t/60)%60).padStart(2,"0"))+":"+pad(t%60);
}
function tmPaint(){
  const left = TM.running ? Math.max(0,TM.end-Date.now()) : TM.left;
  $("#tmDisplay").textContent = tmFmt(left);
  $("#tmDisplay").classList.toggle("fire", TM.running && left<=10000 && left>0);
  if(TM.running && left<=0) tmFire();
}
function tmSet(mins){ TM.dur=mins*60000; TM.left=TM.dur; TM.running=false; TM.fired=false; clearInterval(TM.int); $("#tmStart").textContent="Start"; tmPaint(); }
function tmToggle(){
  if(TM.running){ TM.left=Math.max(0,TM.end-Date.now()); TM.running=false; clearInterval(TM.int); $("#tmStart").textContent="Start"; }
  else{
    if(TM.fired || TM.left<=0){ tmSet(Math.round(TM.dur/60000)||25); }   // v7.3.1: restart from the same length
    TM.end=Date.now()+TM.left; TM.running=true; TM.fired=false; $("#tmStart").textContent="Pause";
    TM.int=setInterval(tmPaint,100);
  }
  tmPaint();
}
function tmFire(){
  TM.running=false; clearInterval(TM.int); TM.left=0; TM.fired=true; $("#tmStart").textContent="Start again";
  $("#tmDisplay").classList.add("fire");
  if(State.settings.timerSound) beep();
  toast("Timer finished — press Start again to run it once more");
  setTimeout(()=>{ $("#tmDisplay").classList.remove("fire"); if(TM.fired) $("#tmStart").textContent="Start"; },4000);
}
function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C();
    [0,0.28,0.56].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=660;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.22);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.25);
    });
    setTimeout(()=>ctx.close(),1400);
  }catch(e){}
}
function renderPresets(){
  const box=$("#tmPresets"); box.innerHTML="";
  State.settings.timerPresets.forEach(m=>{

  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){

/* v7.4.1 BACK GESTURE. One history entry is kept "in front" of the page; when the back button or
   gesture pops it, the topmost layer (photo viewer, editor, settings page, sheet, task detail,
   archive...) is closed and the entry is put back. With nothing to close, the first press asks
   for a second one before leaving, so a stray swipe never exits the app. */
function appBack(){
  if(!$("#photoView").hidden){ pvCloseView(); return true; }
  if($("#edSheet").classList.contains("on")){ closeEditor(); return true; }
  if($("#taskRun").classList.contains("on")){ toast("Stop the timer first"); return true; }
  if($("#stPanel").classList.contains("on") && !$$(".sheet.on").length){
    if(stPage!=null) stBackFn(); else closeAll();
    return true;
  }
  if(sheetOpen()){ if(qaHasDraft()) closeQuickAdd(); else closeAll(); return true; }
  if($("#rfOverlay").classList.contains("on")){ RF.close(); return true; }
  if($("#taskDetail").classList.contains("on")){ TD.close(); return true; }
  if($("#archiveScreen").classList.contains("on")){ closeArchive(); return true; }
  if($("#statsScreen").classList.contains("on")){ closeStats(); return true; }
  if(typeof CALSEL!=="undefined" && CALSEL.active){ calSelClear(); return true; }
  if(editMode){ toggleEdit(); return true; }
  const home=ORDER().indexOf("home");
  if(home>=0 && screenIdx!==home){ goTo(home); return true; }
  return false;
}
let backArmed=false, backExit=false, backExitT=null;
function backArm(){
  if(backArmed) return;
  backArmed=true;
  try{ history.replaceState({bt:0},""); history.pushState({bt:1},""); }catch(e){ backArmed=false; }
}
function backInit(){
  if(backInit.done) return; backInit.done=true;
  // browsers only honour history entries made after a real tap, so arm on the first one
  ["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev,backArm,{once:true,passive:true,capture:true}));
  window.addEventListener("popstate",()=>{
    if(!backArmed) return;
    const push=()=>{ try{ history.pushState({bt:1},""); }catch(e){} };
    if(appBack()){ backExit=false; push(); return; }
    if(WIZ.active || !$("#gate").classList.contains("hidden")){ push(); return; }
    if(backExit){ backExit=false; clearTimeout(backExitT); backArmed=false; try{ history.back(); }catch(e){} return; }
    backExit=true; toast("Swipe back again to leave");
    clearTimeout(backExitT); backExitT=setTimeout(()=>{ backExit=false; },2200);
    push();
  });
}
function appKeydown(e){
  if(!$("#photoView").hidden){          // v7.3: photo viewer first
    if(e.key==="Escape") pvCloseView();
    else if(e.key==="ArrowRight") pvNav(1);
    else if(e.key==="ArrowLeft") pvNav(-1);
    return;
  }
  if(WIZ.active){
    if(sheetOpen()){ if(e.key==="Escape") closeAll(); return; }
    if(e.key.toLowerCase()==="u" && WIZ.step===0 && !e.ctrlKey && !e.metaKey && !e.altKey) skipWizard();
    else if(e.key==="Enter" && !(e.target.closest && e.target.closest("button"))) wizNext();
    return;
  }
  if(e.key==="ArrowDown" && $("#qaSheet").classList.contains("on")){ closeQuickAdd(); return; }
  if(overlayOpen()){
    if(e.key==="Escape"){
      if(sheetOpen()) closeAll();
      else if($("#taskRun").classList.contains("on")) trStop();
      else if($("#rfOverlay").classList.contains("on")) RF.close();
      else if($("#archiveScreen").classList.contains("on")) closeArchive();
      else if($("#statsScreen").classList.contains("on")) closeStats();
      else if($("#taskDetail").classList.contains("on")) TD.close();
    }else if(e.key===" " && $("#taskRun").classList.contains("on")){ e.preventDefault(); trTogglePause(); }
    return;
  }
  if(CALSEL.active){ if(e.key==="Escape") calSelClear(); return; }
  // v7.3.1: a sheet or the settings panel owns the keyboard while it's open.
  // Without this, arrow keys changed screens behind the quick-add sheet and
  // space started the timer on whichever screen happened to be underneath.
  if(sheetOpen()){ if(e.key==="Escape") closeAll(); return; }
  if(e.key==="ArrowRight") navStep(1);
  else if(e.key==="ArrowLeft") navStep(-1);
  else if(e.key==="ArrowUp" && ORDER()[screenIdx]==="home") openQuickAdd();
  else if(e.key==="Escape"){ if(qaHasDraft()) closeQuickAdd(); else if(sheetOpen()) closeAll(); else if(editMode) toggleEdit(); }
  else if(e.key===" " && ORDER()[screenIdx]==="stopwatch"){ e.preventDefault(); swToggle(); }
  else if(e.key===" " && ORDER()[screenIdx]==="timer"){ e.preventDefault(); tmToggle(); }
}
window.addEventListener("keydown", e=>{
  if(e.target.matches("input,select,textarea")){
    if(e.key==="Escape"){ e.target.blur(); return; }
    if(e.key==="ArrowDown" && $("#qaSheet").classList.contains("on") && e.target.tagName!=="SELECT" && e.target.tagName!=="TEXTAREA" && e.target.type!=="range"){ closeQuickAdd(); return; }

    if(box && !box.classList.contains("on")){ e.target.blur(); appKeydown(e); return; }
    return;
  }

/* v7.5 PHOTO TRANSPORT.
   Browser -> Cloudflare Worker -> R2. The Worker answers CORS itself and checks
   the Firebase login, so there is no bucket CORS policy, no SigV4 and no secret
   in this file. Reads are plain public URLs served by the same Worker. */
function photoBase(){ return (PHOTO_SERVER.url||"").replace(/\/+$/,""); }
function photoHost(){ return photoBase().replace(/^https:\/\//,""); }

async function photoSend(method,key,body){ netStart(); try{ return await photoSend0(method,key,body); } finally{ netEnd(); } }
async function photoSend0(method,key,body){
  if(!R2_CONFIGURED) throw new Error("No photo server is set. Paste the Worker URL into PHOTO_SERVER near the top of this file.");
  if(!fsUser) throw new Error("Sign in first.");
  if(body!=null && !(body.size>0)) throw new Error("Refusing to upload an empty file — the image could not be encoded.");
  const url=photoBase()+"/"+key;
  const attempt=async force=>{
    const tok=await fsUser.getIdToken(!!force);
    try{
      return await fetch(url,{
        method,
        headers:Object.assign({"Authorization":"Bearer "+tok}, body?{"Content-Type":"image/jpeg"}:{}),
        body:body||undefined
      });
    }catch(e){
      const err=new Error("Couldn't reach the photo server ("+photoHost()+"). Check the Worker URL, or whether this network or VPN blocks it.");
      err.isNetwork=true; err.cause=e;
      throw err;
    }
  };
  let res=await attempt(false);
  if(res.status===401) res=await attempt(true);      // token may have just expired
  if(!res.ok){
    let detail="";
    try{ const j=await res.json(); detail=j&&j.error?j.error:""; }catch(e){}
    const err=new Error("Photo server "+method+" returned "+res.status+(detail?" — "+detail:""));
    err.status=res.status;
    throw err;
  }
  return res;
}
// v7.4: a photo still waiting in the queue isn't on the server yet, so it used to show
// as broken. It is now drawn from the local blob until the upload finishes.
async function photoURL(taskId,photoId,thumb){
  const k=taskId+"|"+photoId;
  if(pqKeySet.has(k)){
    const ck=k+(thumb?"|t":"|m");
    if(pqUrlCache.has(ck)) return pqUrlCache.get(ck);
    const it=await PQ.get(k);
    if(it){
      const b=thumb?(it.thumb||it.blob):it.blob;
      if(b){ const u=URL.createObjectURL(b); pqUrlCache.set(ck,u); return u; }
    }
  }
  if(!fsUser || !R2_CONFIGURED) return null;
  return photoBase()+"/photos/"+fsUser.uid+"/"+taskId+"/"+photoId+(thumb?"_t":"")+".jpg";
}
async function uploadPhotoBlobs(taskId,photoId,blob,thumb){
  const base="photos/"+fsUser.uid+"/"+taskId+"/"+photoId;
  await photoSend("PUT",base+".jpg",blob);
  if(thumb) await photoSend("PUT",base+"_t.jpg",thumb);
}
function loadImgFile(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src=url;
  });
}
function drawToBlob(img,edge,q){
  const nw=img.naturalWidth||img.width, nh=img.naturalHeight||img.height;
  if(!(nw>0&&nh>0)) return Promise.reject(new Error("That image has no readable dimensions."));
  const scale=Math.min(1,edge/Math.max(nw,nh));
  const w=Math.max(1,Math.round(nw*scale)), h=Math.max(1,Math.round(nh*scale));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d");
  if(!ctx) return Promise.reject(new Error("This browser blocked canvas — can't compress the photo."));
  ctx.drawImage(img,0,0,w,h);
  return new Promise((res,rej)=>{
    if(!cv.toBlob) return rej(new Error("This browser can't encode images."));
    cv.toBlob(b=>{
      // toBlob hands back null on failure — that used to become a bodyless PUT
      // that R2 accepted and stored as 0 bytes
      if(!b) return rej(new Error("The photo couldn't be encoded as JPEG."));
      if(b.size===0) return rej(new Error("The photo came out empty."));
      res(b);
    },"image/jpeg",q);
  });
}
async function processPhotoFile(file){
  const img=await loadImgFile(file);
  const pq=PHOTO_QUALITY[State.settings.photoQuality]||PHOTO_QUALITY.high;
  const blob=await drawToBlob(img,pq.edge,pq.q);
  const thumb=await drawToBlob(img,360,.7);
  return {blob,thumb,w:img.naturalWidth||img.width,h:img.naturalHeight||img.height};
}

async function attachPhotoToTask(task,photoId,blob,thumb){
  const entry={key:task.id+"|"+photoId,taskId:task.id,photoId,blob,thumb};
  if(!fsReady || !fsUser){
    try{
      await PQ.put(entry);
      setPhotoError(null);
      toast("Saved on this device — it will upload when you're signed in.");
    }catch(e){
      // the queue itself is gone; say so instead of losing the photo quietly
      setPhotoError("Couldn't save the photo on this device: "+(e&&e.message?e.message:e));
      toast("Couldn't save that photo on this device.");
    }
    return;
  }
  try{
    await uploadPhotoBlobs(task.id,photoId,blob,thumb);
    setPhotoError(null);   // v7.3.1: report success, not silence
  }catch(e){
    // Keep the blob so nothing is lost, but say so out loud. Re-thrown detail
    // goes to the console too — the toast is short-lived on a phone.
    let queued=true;
    try{ await PQ.put(entry); pqNoteFail(entry.key,e); }catch(e2){ queued=false; }
    const msg=(e&&e.message)||"Upload failed";
    setPhotoError("Upload problem: "+msg+(queued?" The photo is saved on this device and will retry.":" The photo could not be saved either."));
    toast(queued ? "Photo saved locally — upload failed. See Photos in settings." : "Photo upload failed and couldn't be saved.");
    if(window.console&&console.error) console.error("BacTrack photo upload failed:",e);
