}
/* IndexedDB pending-photo queue — blobs taken offline flush up on reconnect.
   v7.4: listing never loads blobs any more (keys only), so a long offline spell
   with many photos can't spike memory; blobs are read one at a time. */
const pqKeySet=new Set();           // keys currently queued (kept in step with IndexedDB)
const pqUrlCache=new Map();         // key|t / key|m -> object URL for not-yet-uploaded photos
const pqMeta={};                    // key -> {err,tries,at}  (in memory: shown in Settings → Photos)
let pqUIHook=null;
function pqForget(k){
  pqKeySet.delete(k); delete pqMeta[k];
  ["|t","|m"].forEach(x=>{ const u=pqUrlCache.get(k+x); if(u){ try{ URL.revokeObjectURL(u); }catch(e){} pqUrlCache.delete(k+x); } });
  pqCount=pqKeySet.size; paintSync();
}
function pqNoteFail(key,e){
  const m=pqMeta[key]||{tries:0}; m.tries++; m.err=(e&&e.message)||"Upload failed"; m.at=Date.now(); pqMeta[key]=m;
}
const PQ={
  db:null,
  open(){ return new Promise(res=>{
    try{
      const rq=indexedDB.open("bactrack-photos",1);
      rq.onupgradeneeded=()=>{ rq.result.createObjectStore("pending",{keyPath:"key"}); };
      rq.onsuccess=()=>{ PQ.db=rq.result; PQ.keys().then(ks=>{ ks.forEach(k=>pqKeySet.add(k)); pqCount=pqKeySet.size; paintSync(); res(); }); };
      rq.onerror=()=>res();
    }catch(e){ res(); }
  });},
  // a failure is a rejection the caller reports, never a silent drop
  put(e){ return new Promise((res,rej)=>{
    if(!PQ.db) return rej(new Error("The offline photo store is not available in this browser."));
    try{
      const tx=PQ.db.transaction("pending","readwrite");
      tx.objectStore("pending").put(e);
      tx.oncomplete=()=>{ pqKeySet.add(e.key); pqCount=pqKeySet.size; paintSync(); res(); };
      tx.onerror=()=>rej(tx.error||new Error("Could not queue that photo."));
      tx.onabort=()=>rej(tx.error||new Error("The photo queue was interrupted."));
    }catch(err){ rej(err); }
  });},
  keys(){ return new Promise(res=>{
    if(!PQ.db) return res([]);
    try{
      const os=PQ.db.transaction("pending").objectStore("pending");
      if(os.getAllKeys){
        const rq=os.getAllKeys(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]);
      }else{
        const out=[], cur=os.openCursor();
        cur.onsuccess=()=>{ const c=cur.result; if(c){ out.push(c.key); c.continue(); } else res(out); };
        cur.onerror=()=>res(out);
      }
    }catch(err){ res([]); }
  });},
  get(key){ return new Promise(res=>{
    if(!PQ.db) return res(null);
    try{
      const rq=PQ.db.transaction("pending").objectStore("pending").get(key);
      rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null);
    }catch(err){ res(null); }
  });},
  del(key){ return new Promise(res=>{
    if(!PQ.db) return res();
    try{
      const tx=PQ.db.transaction("pending","readwrite");
      tx.objectStore("pending").delete(key);
      tx.oncomplete=()=>{ pqForget(key); res(); }; tx.onerror=()=>res();
    }catch(err){ res(); }
  });}
};
let pqFlushing=false;
async function photoQueueFlush(force){
  if(pqFlushing || !fsReady || !R2_CONFIGURED || !fsUser) return 0;
  pqFlushing=true;
  let done=0;
  try{
    const keys=await PQ.keys();
    for(const key of keys){
      const it=await PQ.get(key);
      if(!it) continue;
      // The task is gone (deleted, or not synced down yet): don't upload into a void.
      // It stays listed in Settings → Photos so it can be removed deliberately.
      if(!State.todos[it.taskId]) continue;
      if(!force && pqMeta[key] && pqMeta[key].permanent) continue;   // v7.4.1: don't hammer a rejected photo every few seconds
      try{
        await uploadPhotoBlobs(it.taskId,it.photoId,it.blob,it.thumb);
        await PQ.del(key);
        done++;
        setPhotoError(null);
      }catch(e){
        pqNoteFail(key,e);
        const msg=(e&&e.message)||"Upload failed";
        if(force) setPhotoError("Upload problem: "+msg);
        if(window.console&&console.warn) console.warn("BacTrack photo upload failed:",e);
        const st=e&&e.status;
        // A photo the server rejects outright (bad file, too large) must not block
        // the healthy ones behind it. Network/auth/rate problems still stop the run.
        const permanent = st>=400 && st<500 && st!==401 && st!==403 && st!==408 && st!==429;
        if(permanent){ pqMeta[key].permanent=true; continue; }
        break;
      }
    }
    if(!pqKeySet.size) setPhotoError(null);
  }finally{ pqFlushing=false; paintSync(); if(pqUIHook) pqUIHook(); }
  return done;
}
// Settings → Photos actions
async function pqRetryOne(key){
  if(!fsReady||!fsUser){ toast("Sign in first."); return; }
  const it=await PQ.get(key); if(!it) return;
  try{
    await uploadPhotoBlobs(it.taskId,it.photoId,it.blob,it.thumb);
    await PQ.del(key); toast("Photo uploaded");
  }catch(e){ pqNoteFail(key,e); toast("Still failing — "+((e&&e.message)||"upload error")); }
  if(pqUIHook) pqUIHook(); renderAll();
}
async function pqRemove(key){
  const it=await PQ.get(key);
  await PQ.del(key);
  if(it){
    const t=State.todos[it.taskId];
    if(t && t.photos){
      const n=t.photos.length;
      t.photos=t.photos.filter(p=>p.id!==it.photoId);
      if(t.photos.length!==n){ t.updatedAt=Date.now(); pushTodo(t); }
    }
  }
}

/* Walks the whole path one step at a time and says which step broke. */
async function photoSelfTest(){ netStart(); try{ return await photoSelfTest0(); } finally{ netEnd(); } }
async function photoSelfTest0(){
  if(!R2_CONFIGURED) return "No photo server is set. Deploy bactrack-photos-worker.js, then paste its URL into PHOTO_SERVER near the top of this file.";
  if(!fsUser) return "Sign in first — the test uploads a file under your account.";
  const lines=["Server: "+photoHost()];
  const readJson=async r=>{ try{ return await r.json(); }catch(e){ return null; } };

  // 1. can this device reach the Worker at all? (plain GET, no custom headers)
  try{
    const r=await fetch(photoBase()+"/ping",{cache:"no-store"});
    const j=await readJson(r);
    if(!r.ok||!j||!j.ok){ lines.push("1. Reach server: FAILED (HTTP "+r.status+"). That URL is not the photo Worker."); return lines.join("\n"); }
    lines.push("1. Reach server: OK");
    if(!j.bucketBound){
      lines.push("2. Bucket: NOT CONNECTED. Worker -> Settings -> Bindings -> Add -> R2 bucket,");
      lines.push("   variable name BUCKET, bucket bactrack-photos. Then deploy again.");
      return lines.join("\n");
    }
    lines.push("2. Bucket connected: OK");
  }catch(e){
    lines.push("1. Reach server: FAILED — this device cannot open "+photoHost()+".");
    lines.push("   Check the URL for typos. If it is right, this network, DNS or VPN is");
    lines.push("   blocking it; try another network or set DNS to 1.1.1.1.");
    return lines.join("\n");
  }

  // 2. login check (sends Authorization, so this also proves CORS preflight)
  try{
    const tok=await fsUser.getIdToken();
    const r=await fetch(photoBase()+"/whoami",{headers:{"Authorization":"Bearer "+tok},cache:"no-store"});
    const j=await readJson(r);
    if(!r.ok){ lines.push("3. Login check: FAILED (HTTP "+r.status+") "+(j&&j.error?j.error:"")); if(r.status===401) lines.push("   If this mentions the clock, fix this device's date and time."); return lines.join("\n"); }
    if(j.uid!==fsUser.uid){ lines.push("3. Login check: uid mismatch."); return lines.join("\n"); }
    lines.push("3. Login check: OK");
  }catch(e){
    lines.push("3. Login check: FAILED — "+(e&&e.message?e.message:e));
    return lines.join("\n");
  }

  // 3. real upload, read back, delete
  const cv=document.createElement("canvas"); cv.width=32; cv.height=32;
  const cx=cv.getContext("2d"); cx.fillStyle="#c0392b"; cx.fillRect(0,0,32,32);
  let blob=null;
  try{ blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.8)); }catch(e){}
  if(!blob||!blob.size){ lines.push("4. Test image: this browser couldn't encode a JPEG."); return lines.join("\n"); }
  const key="photos/"+fsUser.uid+"/_selftest/test-"+Date.now().toString(36)+".jpg";
  try{
    await photoSend("PUT",key,blob);
    lines.push("4. Upload: OK ("+blob.size+" bytes)");
  }catch(e){
    lines.push("4. Upload: FAILED — "+(e&&e.message?e.message:e));
    return lines.join("\n");
  }
  try{
    const r=await fetch(photoBase()+"/"+key,{cache:"no-store"});
    const len=(await r.arrayBuffer()).byteLength;
    lines.push("5. Read back: HTTP "+r.status+", "+len+" bytes"+(r.status===200&&len===blob.size?" — matches":" — MISMATCH"));
  }catch(e){ lines.push("5. Read back: FAILED — "+(e&&e.message?e.message:e)); }
  try{ await photoSend("DELETE",key); lines.push("6. Cleanup: OK"); }
  catch(e){ lines.push("6. Cleanup failed (harmless): "+(e&&e.message?e.message:e)); }
  if(lines.every(l=>!/FAILED|MISMATCH/.test(l))) lines.push("","Photo pipeline is working.");
  return lines.join("\n");
}

function saveQuickAdd(){
  const title=$("#qaName").value.trim();
  if(!title){ $("#qaName").focus(); toast("Give the task a name."); return; }
  const type=$("#qaType").value, subject=$("#qaSubject").value;
  const ty=typeById(type);
  const method=(ty&&ty.method)?$("#qaMethod").value:"";
  const due=$("#qaDate").value||iso(new Date());
  const rep=repeatById($("#qaRepeat").value);
  const duration=clamp(Number($("#qaDuration").value)||State.settings.defaultDuration||25,10,60);
  const s=State.settings;
  // v7.3.1: same projection as updateQABudget(), so the guard and the warning agree
  const laid=dayTaskLayout(due);
  let lastEnd=s.calAnchorHour*60;
  laid.forEach(l=>{ if(l.end>lastEnd) lastEnd=l.end; });
  const endMin=lastEnd+duration;
  if(endMin > s.dueBlockHour*60){
    // v7.3.1: report the time the queue actually reaches, not the cut-off hour
    toast("That day is full — the queue would run to "+fmtClockMin(endMin)+".");
    return;
  }
  const series=(rep&&rep.intervals&&rep.intervals.length)?uid():null;
  const base=fromISO(due);
  let baseT=null;
  const mk=(d,step)=>{
    const t={id:uid(),title,type,subject,method:method||null,due:iso(d),duration,done:false,doneAt:null,
             seriesId:series,step:step||null,createdAt:Date.now(),updatedAt:Date.now()};
    State.todos[t.id]=t; pushTodo(t);
    return t;
  };
  baseT=mk(base, series?"1/"+(rep.intervals.length+1):null);
  if(series) rep.intervals.forEach((off,i)=> mk(addDays(base,off), (i+2)+"/"+(rep.intervals.length+1)));

  // v7.3: attach photos to the base task, metadata rides Firestore offline,
  // blobs upload now or queue in IndexedDB if offline
  if(qaPhotos.length){
    baseT.photos=qaPhotos.map(p=>({id:p.id,w:p.w,h:p.h}));
    baseT.updatedAt=Date.now();
    State.todos[baseT.id]=baseT; pushTodo(baseT);
    qaPhotos.forEach(p=>{ attachPhotoToTask(baseT,p.id,p.blob,p.thumb); });
  }
  qaPhotos.forEach(p=>URL.revokeObjectURL(p.url));
  qaPhotos=[];
  closeAll(); renderAll();
  toast(series ? (rep.intervals.length+1)+" tasks scheduled" : "Task added");
}
function updateQABudget(){

  // shifts the preview the same way it shifts the calendar
  const laid=dayTaskLayout(due);

  laid.forEach(l=>{ if(l.end>lastEnd) lastEnd=l.end; });
  const startMin=lastEnd;
  const endMin=startMin+mins;
  save.disabled=false;
  box.style.fontWeight="500";
  if(endMin > s.dueBlockHour*60){
    box.style.color="var(--accent)";

    save.disabled=true;

    box.style.color="var(--accent)";
    box.textContent=(load?fmtMin(load)+" already queued · ":"")+"with this one the day runs to "+fmtClockMin(endMin)+" — past "+fmtHourMin(s.dueWarnHour,0)+".";
  }else if(load>0){
    box.style.color="var(--accent)";

  }else{

  }
}

  if(typeof v!=="string") return null;

  if(/^#[0-9a-f]{6}$/i.test(s)) return s.toLowerCase();
  if(/^#[0-9a-f]{3}$/i.test(s)) return "#"+s.slice(1).split("").map(c=>c+c).join("").toLowerCase();
  if(/^[0-9a-f]{6}$/i.test(s)) return "#"+s.toLowerCase();
  return null;
}

function sessionClash(dow,cand){
  const a=minOf(cand.start), b=minOf(cand.end);
  if(!(b>a)) return "The end time has to be after the start time.";
  for(const y of sessionsFor(dow)){
    if(y.id===cand.id) continue;
    const c=minOf(y.start), d=minOf(y.end);
    if(a<d && c<b) return "That overlaps "+subjectName(y.subject)+" ("+y.start+"–"+y.end+") on this day.";
  }
  return null;
}
function openSessionEditor(dow,x){
  const isNew=!x;
  x=x||{id:uid(),subject:State.taxonomy.subjects[0].id,start:"08:00",end:"10:00",kind:"class"};
  openEditor(isNew?"New session":"Session", b=>{
    const su=field(b,"Subject","select",x.subject,State.taxonomy.subjects);
    let st,en;
    rowOf(b,r=>{ st=field(r,"Starts","time",x.start); en=field(r,"Ends","time",x.end); });
    const kd=field(b,"Kind","select",x.kind,[{id:"class",name:"Class"},{id:"tutoring",name:"Tutoring"}]);
    hint(b,"Tutoring sessions are what the reminder line at the bottom watches for.");
    // v7.3.1: warn on overlap instead of silently stacking two classes
    const warn=el("div","f-hint"); warn.style.color="var(--accent)"; b.appendChild(warn);
    actions(b,"Save",()=>{
      const cand={id:x.id,subject:su.value,start:st.value||x.start,end:en.value||x.end,kind:kd.value};
      const problem=sessionClash(dow,cand);
      if(problem){ warn.textContent=problem; return; }
      Object.assign(x,cand);
      const arr=State.schedule.days[dow]||[];
      if(isNew) arr.push(x); else{ const i=arr.findIndex(y=>y.id===x.id); if(i>=0) arr[i]=x; }
      State.schedule.days[dow]=arr; pushConfig("schedule");
      openDayEditor(dow); renderAll();
    },"Back",()=>openDayEditor(dow));
    const check=()=>{ const p=sessionClash(dow,{id:x.id,start:st.value,end:en.value}); warn.textContent=p||""; };
    st.addEventListener("change",check); en.addEventListener("change",check);
    check();
  });
}

function fmtBytes(n){ return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"; }
function stPhotosQueue(sec){
  const wrap=el("div","pq-wrap"); sec.appendChild(wrap);

  pqUIHook=()=>{ const w=document.querySelector(".pq-wrap"); if(w) pqRender(w); };

async function pqRender(wrap){
  const seq=stRenderSeq;
  const keys=await PQ.keys();
  pqCount=keys.length; paintSync();
  const items=[];
  for(const k of keys.slice(0,40)){ const it=await PQ.get(k); if(it) items.push(it); }
  if(seq!==stRenderSeq || !wrap.isConnected) return;
  pqThumbUrls.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} }); pqThumbUrls=[];
  wrap.innerHTML="";
  wrap.appendChild(el("div","pq-h","Waiting to upload"));
  if(!keys.length){
    wrap.appendChild(el("div","pq-empty","Nothing waiting. Every photo is uploaded."));
    const rv=document.querySelector(".st-rv-photos"); if(rv) rv.textContent="";
    return;
  }
  const failed=keys.filter(k=>pqMeta[k]).length;
  wrap.appendChild(el("div","pq-sum",keys.length+" photo"+(keys.length===1?"":"s")+(failed?" · "+failed+" failed":" · not uploaded yet")));
  const bar=el("div","f-row"); bar.style.margin="10px 0 6px";
  const ra=el("button","btn small","Retry all"); ra.type="button";
  ra.addEventListener("click",async()=>{ ra.disabled=true; ra.textContent="Uploading…"; const n=await photoQueueFlush(true); toast(n?n+" uploaded":"Nothing uploaded — see the status below"); renderAll(); });
  const ca=el("button","btn small danger","Clear all"); ca.type="button";
  ca.addEventListener("click",()=>confirmDelete("all "+keys.length+" waiting photos",async()=>{
    for(const k of await PQ.keys()) await pqRemove(k);
    renderAll(); if(pqUIHook) pqUIHook(); toast("Cleared");
  }));
  bar.append(ra,ca); wrap.appendChild(bar);
  const list=el("div","sect-list");
  items.forEach(it=>{
    const row=el("div","item pq-item");
    const th=el("div","pq-thumb");
    try{ const u=URL.createObjectURL(it.thumb||it.blob); pqThumbUrls.push(u); const im=el("img"); im.alt=""; im.src=u; th.appendChild(im); }catch(e){}
    row.appendChild(th);
    const m=el("div","item-main");
    const t=State.todos[it.taskId];
    m.appendChild(el("div","item-t",t?(t.title||"Untitled task"):"Task not found"));
    const meta=pqMeta[it.key];
    const size=fmtBytes((it.blob&&it.blob.size)||0);
    let st=size+" · Waiting to upload";
    if(!t) st=size+" · The task was deleted — safe to remove";
    else if(meta) st=size+" · Failed ("+meta.tries+"×): "+meta.err;
    const d=el("div","item-d pq-st"+((meta||!t)?" bad":""),st); m.appendChild(d);
    row.appendChild(m);
    const rb=el("button","item-btn","Retry"); rb.type="button";
    rb.addEventListener("click",()=>{ rb.disabled=true; rb.textContent="…"; pqRetryOne(it.key); });
    if(t) row.appendChild(rb);
    const xb=el("button","item-btn danger","Remove"); xb.type="button";
    xb.addEventListener("click",()=>confirmDelete("this photo",async()=>{ await pqRemove(it.key); renderAll(); if(pqUIHook) pqUIHook(); }));
    row.appendChild(xb);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  if(keys.length>items.length) wrap.appendChild(el("div","pq-sum","…and "+(keys.length-items.length)+" more"));
}

/* ---- Devices ---- */
const DEVICE_KEY="bactrack_device_id_v1", DEVICE_NAMED_KEY="bactrack_device_named_v1";
function deviceId(){
  let id=null;
  try{ id=localStorage.getItem(DEVICE_KEY); }catch(e){}
  if(!id){ id="d"+uid()+Date.now().toString(36); try{ localStorage.setItem(DEVICE_KEY,id); }catch(e){} }
  return id;
}
function guessDeviceName(){
  const ua=navigator.userAgent||""; let os="Device";
  if(/Android/.test(ua)){ const m=/Android[^;]*;\s*([^;)]+)/.exec(ua); os=(m&&m[1]&&m[1].trim().length>1&&m[1].trim()!=="K")?m[1].trim():"Android"; }
  else if(/iPhone/.test(ua)) os="iPhone"; else if(/iPad/.test(ua)) os="iPad";
  else if(/Mac OS X/.test(ua)) os="Mac"; else if(/Windows/.test(ua)) os="Windows PC";
  else if(/Linux|X11/.test(ua)) os="Linux";
  const br=/Edg\//.test(ua)?"Edge":/OPR\//.test(ua)?"Opera":/Firefox\//.test(ua)?"Firefox":/Chrome\//.test(ua)?"Chrome":/Safari\//.test(ua)?"Safari":"Browser";
  return os+" · "+br;
}
const devicesCol=()=>uroot().collection("devices");
let devBeat=0;
function registerDevice(force){
  if(!fsReady || !fsUser) return;
  const now=Date.now();
  if(!force && now-devBeat<10*60*1000) return;
  devBeat=now;
  const body={lastSeen:now, ua:(navigator.userAgent||"").slice(0,180), app:"7.4.2"};
  let named=false; try{ named=!!localStorage.getItem(DEVICE_NAMED_KEY); }catch(e){}
  if(!named){ body.name=guessDeviceName(); body.firstSeen=now; }
  netTrack(devicesCol().doc(deviceId()).set(body,{merge:true}))
    .then(()=>{ if(!named){ try{ localStorage.setItem(DEVICE_NAMED_KEY,"1"); }catch(e){} } })
    .catch(()=>{});
}
function agoText(ts){
  if(!ts) return "unknown";
  const m=Math.round((Date.now()-ts)/60000);
  if(m<2) return "just now"; if(m<60) return m+" min ago";
  const h=Math.round(m/60); if(h<24) return h+" h ago";
  const d=Math.round(h/24); return d+(d===1?" day ago":" days ago");
}
async function stDevicesLoad(list){
  const seq=stRenderSeq;
  list.appendChild(el("div","item-d","Loading…"));
  const docs=[];
  try{ const snap=await netTrack(devicesCol().get()); snap.forEach(d=>docs.push(Object.assign({id:d.id},d.data()))); }
  catch(e){
    if(seq!==stRenderSeq) return;
    list.innerHTML=""; list.appendChild(el("div","item-d","Couldn't load devices"+(navigator.onLine?".":" — you're offline.")));
    return;
  }
  if(seq!==stRenderSeq || !list.isConnected) return;
  const me=deviceId();
  if(!docs.some(d=>d.id===me)) docs.push({id:me,name:guessDeviceName(),lastSeen:Date.now()});
  docs.sort((a,b)=>(a.id===me?-1:0)-(b.id===me?-1:0) || (b.lastSeen||0)-(a.lastSeen||0));
  list.innerHTML="";
  docs.forEach(d=>{
    const mine=d.id===me;
    const it=el("div","item"); const m=el("div","item-main");
    m.appendChild(el("div","item-t",(d.name||"Unnamed device")+(mine?" (this device)":"")));
    m.appendChild(el("div","item-d",mine?"Active now":"Last active "+agoText(d.lastSeen)));
    it.appendChild(m);
    const rn=el("button","item-btn","Rename"); rn.type="button";
    rn.addEventListener("click",()=>openEditor("Device name",bb=>{
      const nm=field(bb,"Name","text",d.name||"");
      actions(bb,"Save",()=>{
        const v=nm.value.trim().slice(0,40)||d.name||"Device";
        devicesCol().doc(d.id).set({name:v},{merge:true}).catch(()=>{});
        if(mine){ try{ localStorage.setItem(DEVICE_NAMED_KEY,"1"); }catch(e){} }
        closeEditor(); renderSettings();
      });
    }));
    it.appendChild(rn);
    if(!mine){
      const rm=el("button","item-btn danger","Remove"); rm.type="button";
      rm.addEventListener("click",()=>confirmDelete("\""+(d.name||"this device")+"\" from the list",async()=>{
        try{ await devicesCol().doc(d.id).delete(); }catch(e){ toast("Couldn't remove it."); }
        renderSettings();
      }));
      it.appendChild(rm);
    }
    list.appendChild(it);
  });
}

function openSettings(focus){
  stPage=null;
  if(focus){ const pg=ST_PAGES.find(p=>p.id===focus||p.sections.indexOf(focus)>=0); if(pg) stPage=pg.id; }
  stLastPage=stPage;             // opening shouldn't play a page-slide
  $("#stPanel").classList.add("on"); scrim(true);
  renderSettings();
  PQ.keys().then(ks=>{ pqCount=ks.length; paintSync(); const v=document.querySelector(".st-rv-photos"); if(v) v.textContent=pqCount?pqCount+" waiting":""; });
}
 $("#stBack").addEventListener("click",stBackFn);
 $("#tbSync").addEventListener("click",()=>{ if(pqCount>0) openSettings("photos"); });
window.addEventListener("keydown",e=>{
  if(e.key==="Escape" && stPage!=null && $("#stPanel").classList.contains("on") && !$$(".sheet.on").length){
    e.stopPropagation(); e.preventDefault(); stBackFn();
  }
},true);
 $("#stClose").addEventListener("click",()=>{ $("#stPanel").classList.remove("on"); scrim(false); });

    const all=el("button","chip"+((!me.subjects||!me.subjects.length)?" on":""),"Every subject");
    all.addEventListener("click",()=>{ me.subjects=[]; rebuild(); });
    chips.appendChild(all);
    State.taxonomy.subjects.forEach(su=>{
      const c=el("button","chip"+(me.subjects&&me.subjects.indexOf(su.id)>=0?" on":""),su.name);

      });
      chips.appendChild(c);
    });
    f.appendChild(chips); b.appendChild(f);
    hint(b,"Repetition is set separately, per task, from the Repetition field when adding it.");
    const desc=field(b,"Description","text",draft&&draft.desc!=null?draft.desc:(me.description||""));

    const total=me.phases.reduce((a,p)=>a+p.pct,0)||1;
    me.phases.forEach((ph,i)=>{
      const blk=el("div","phase-block");
      const lb=el("input","phase-label"); lb.type="text"; lb.value=ph.label; lb.placeholder="What to do in this block";
      lb.addEventListener("change",()=>{ ph.label=lb.value.trim()||ph.label; pushConfig("taxonomy"); });

      rm.addEventListener("click",()=>{

    pf.appendChild(addBlk);

function makeFlip(overlayId, cardId){
  const overlay=$("#"+overlayId), card=$("#"+cardId);
  const st={busy:false, ghost:null, source:null, timers:[]};
  // v7.3.1: store plain timeout ids and prune on fire — the old filter compared
  // `x.id` against a number, so nothing was ever removed from the list
  function after(ms,fn){
    const id=setTimeout(()=>{ st.timers=st.timers.filter(x=>x!==id); fn(); },ms);
    st.timers.push(id);
  }
  function clearStyles(){
    card.style.position=""; card.style.left=""; card.style.top="";
    card.style.width=""; card.style.height="";
    card.style.maxHeight=""; card.style.margin="";
  }
  function zoom(){ return parseFloat(getComputedStyle(document.body).zoom)||1; }
  function dismiss(){
    st.timers.forEach(clearTimeout); st.timers=[];
    overlay.classList.remove("on");
    overlay.style.background="";
    card.classList.remove("flip","primed","zoomout","fadeout");
    clearStyles();
    if(st.ghost){ st.ghost.remove(); st.ghost=null; }
    if(st.source && st.source.isConnected) st.source.classList.remove("gone");
    st.source=null;
    st.busy=false;
  }
  function open(sourceEl, ghostHTML, btnish){
    if(st.busy) return;
    st.source=sourceEl||null;
    card.classList.add("primed");
    if(sourceEl && sourceEl.isConnected && State.settings.animations){
      try{
        const z=zoom();
        const src=sourceEl.getBoundingClientRect();
        const dest=card.getBoundingClientRect();
        if(!(src.width>4 && dest.width>4)) throw 0;
        const ghost=el("div","td-ghost"+(btnish?" btnish":""));
        if(ghostHTML!=null) ghost.innerHTML=ghostHTML;
        card.appendChild(ghost); st.ghost=ghost;
        sourceEl.classList.add("gone");
        card.classList.add("flip");
        card.style.position="fixed";
        card.style.left=(src.left/z)+"px"; card.style.top=(src.top/z)+"px";
        card.style.width=(src.width/z)+"px"; card.style.height=(src.height/z)+"px";
        card.style.maxHeight="none"; card.style.margin="0";
        overlay.classList.add("on");
        void card.offsetWidth;
        card.style.left=(dest.left/z)+"px"; card.style.top=(dest.top/z)+"px";
        card.style.width=(dest.width/z)+"px"; card.style.height=(dest.height/z)+"px";
        requestAnimationFrame(()=>{ ghost.classList.add("fade"); });
        st.busy=true;
        after(210,()=>{ card.classList.remove("primed"); });
        after(390,()=>{
          card.classList.remove("flip");
          card.style.position=""; card.style.left=""; card.style.top="";
          card.style.margin=""; card.style.maxHeight="";
          if(st.ghost){ st.ghost.remove(); st.ghost=null; }
          st.busy=false;
        });
        return;
      }catch(e){
        if(st.ghost){ st.ghost.remove(); st.ghost=null; }
        card.classList.remove("flip");
        clearStyles();
        if(sourceEl.classList) sourceEl.classList.remove("gone");
      }
    }
    overlay.classList.add("on");
    card.classList.remove("primed");
  }
  function close(){
    if(st.busy) return;
    const src=st.source;
    if(src && src.isConnected && State.settings.animations && overlay.classList.contains("on")){
      card.classList.add("primed");
      try{
        const z=zoom();
        const cur=card.getBoundingClientRect();
        const tgt=src.getBoundingClientRect();
        if(!(cur.width>4 && tgt.width>4)) throw 0;
        card.classList.add("flip");
        card.style.position="fixed";
        card.style.left=(cur.left/z)+"px"; card.style.top=(cur.top/z)+"px";
        card.style.width=(cur.width/z)+"px"; card.style.height=(cur.height/z)+"px";
        card.style.maxHeight="none"; card.style.margin="0";
        overlay.style.background="rgba(0,0,0,0)";
        void card.offsetWidth;
        card.style.left=(tgt.left/z)+"px"; card.style.top=(tgt.top/z)+"px";
        card.style.width=(tgt.width/z)+"px"; card.style.height=(tgt.height/z)+"px";
        st.busy=true;
        after(370,()=>{ dismiss(); });
        return;
      }catch(e){ card.classList.remove("flip"); clearStyles(); }
    }
    if(State.settings.animations && overlay.classList.contains("on")){
      card.classList.add("fadeout");
      st.busy=true;
      after(270,()=>{ dismiss(); });
      return;
    }
    dismiss();
  }
  return {open, close, dismiss, st};
}

function fillTaskDetail(t, arch){

  inner.innerHTML=""; icons.innerHTML=""; acts.innerHTML="";
  card.style.setProperty("--card-c", taskColor(t));

  const titleRow=el("div","td-title-row");
  titleRow.appendChild(el("div","td-title", t.title));

  }

  meta.textContent=bits.join(" · ");

  const queue=tasksDueOn(t.due||today);
  const idx=queue.findIndex(x=>x.id===t.id);
  if(idx>=0){
    // v7.3.1: ask dayTaskLayout instead of re-deriving the window here, so the
    // detail card and the calendar can never disagree about when a task runs
    const laid=dayTaskLayout(t.due||today);

    const startMin=me ? me.start : (t.startMin!=null?t.startMin:State.settings.calAnchorHour*60);

      (idx+1)+" of "+queue.length+" queued · runs "+fmtClockMin(startMin)+" – "+fmtClockMin(startMin+dur)));

  $$(".td-photos").forEach(n=>n.remove());

    const pw=el("div","td-photos");

      const th=el("button","td-photo");

        .catch(()=>{ th.classList.add("pending"); });
      th.addEventListener("click",ev=>{ ev.stopPropagation(); openPhotoView(t,i,th); });
      pw.appendChild(th);
    });
    card.appendChild(pw);
  }

  // actions — home context vs archive context
  const c=el("button","btn","Cancel");
  c.addEventListener("click",()=>TD.close());
  acts.appendChild(c);
  if(arch){
    if(!t.done){
      const done=el("button","btn primary","Done");
      done.addEventListener("click",()=>{
        t.done=true; t.doneAt=Date.now(); t.updatedAt=Date.now();
        if(t.missed) t.rescheduled=false;   // keep missed history, show pill via t.missed
        State.todos[t.id]=t; pushTodo(t); TD.dismiss(); renderAll();
        toast("Marked done");
      });
      acts.appendChild(done);
      const start=el("button","btn","Start");
      start.addEventListener("click",()=>{
        if(TD.st.busy) return;
        const wait=State.settings.animations?300:0;
        if(wait) card.classList.add("zoomout");
        setTimeout(()=>{ TD.dismiss(); startTaskRun(t); },wait);
      });
      acts.appendChild(start);
    }
    const restore=el("button","btn", t.done?"Restore":"Put back");
    restore.addEventListener("click",()=>{
      t.archived=false; t.archivedAt=null; t.updatedAt=Date.now();
      State.todos[t.id]=t; pushTodo(t); TD.dismiss(); renderAll();
      toast("Back on the list");

    acts.appendChild(restore);
  }else{
    const a=el("button","btn","Archive");
    a.addEventListener("click",()=>{
      t.archived=true; t.archivedAt=Date.now(); t.updatedAt=Date.now();
      State.todos[t.id]=t; pushTodo(t); TD.dismiss(); renderAll(); toast("Moved to the archive");

    const go=el("button","btn primary","Start");
    go.addEventListener("click",()=>{
      if(TD.st.busy) return;

  eb.addEventListener("click",e=>{ e.stopPropagation(); TD.dismiss(); openTodoEditor(t); });

const PV={t:null, i:0, srcEl:null, animate:false};
function openPhotoView(t, idx, sourceEl){

function pvZoomReset(){
  const st=$("#pvStage");
  st.dataset.z=1; st.dataset.x=0; st.dataset.y=0;
  const img=st.querySelector("img"); if(img) img.style.transform="";
}
function pvApplyZoom(){
  const st=$("#pvStage"), img=st.querySelector("img"); if(!img) return;
  img.style.transform="translate("+st.dataset.x+"px,"+st.dataset.y+"px) scale("+st.dataset.z+")";
  img.style.cursor=st.dataset.z>1?"grab":"";
}
function pvPaint(){
  const t=PV.t;
  const stage=$("#pvStage");
  stage.innerHTML="";
  pvZoomReset();
  if(!t || !t.photos || !t.photos.length) return;
  const p=t.photos[PV.i];
  const img=el("img"); img.alt="";
  stage.appendChild(img);
  // v7.3.1: only run the expand animation once the bitmap exists, otherwise the
  // FLIP measures a zero-height box and the photo jumps in at the wrong size
  const animate=PV.animate; PV.animate=false;
  const mainSrc=photoURL(t.id,p.id,false).catch(()=>null);
  mainSrc.then(u=>{
    if(!u){ img.alt="Photo unavailable"; return; }
    if(animate) img.onload=()=>{ img.onload=null; pvAnimateFrom(); };
    img.src=u;
  });
  $("#pvCount").textContent=(PV.i+1)+" of "+t.photos.length;
  const thumbs=$("#pvThumbs"); thumbs.innerHTML="";
  t.photos.forEach((pp,i)=>{
    const th=el("button","pv-thumb"+(i===PV.i?" on":""));

    th.appendChild(im);
    photoURL(t.id,pp.id,true).then(u=>{ if(u) im.src=u; }).catch(()=>{});
    th.addEventListener("click",()=>{ PV.i=i; pvPaint(); });

// scroll wheel to zoom, left-click drag to pan
(function(){
  const st=$("#pvStage");
  st.style.overflow="hidden";
  st.addEventListener("wheel",e=>{
    const img=st.querySelector("img"); if(!img) return;
    e.preventDefault();
    let z=parseFloat(st.dataset.z||1);
    z=Math.min(6,Math.max(1,z-e.deltaY*0.0015*z*6));
    st.dataset.z=z;
    if(z<=1){ st.dataset.x=0; st.dataset.y=0; }
    pvApplyZoom();
  },{passive:false});
  let dragging=false,lx=0,ly=0;
  st.addEventListener("mousedown",e=>{
    if(e.button!==0) return;
    const img=st.querySelector("img"); if(!img || parseFloat(st.dataset.z||1)<=1) return;
    dragging=true; lx=e.clientX; ly=e.clientY; img.style.cursor="grabbing"; e.preventDefault(); e.stopPropagation();
  },true);
  window.addEventListener("mousemove",e=>{
    if(!dragging) return;
    st.dataset.x=parseFloat(st.dataset.x||0)+(e.clientX-lx);
    st.dataset.y=parseFloat(st.dataset.y||0)+(e.clientY-ly);
    lx=e.clientX; ly=e.clientY;
    pvApplyZoom();
  });
  window.addEventListener("mouseup",()=>{ dragging=false; const img=st.querySelector("img"); if(img) img.style.cursor=parseFloat(st.dataset.z||1)>1?"grab":""; });
  st.addEventListener("dblclick",()=>{ st.dataset.z=1; st.dataset.x=0; st.dataset.y=0; pvApplyZoom(); });
})();
function pvAnimateFrom(){
  const img=$("#pvStage img"), src=PV.srcEl;
  if(!img || !src || !State.settings.animations) return;
  if(!(img.naturalWidth>0)) return;   // v7.3.1: nothing decoded yet, no FLIP
  const stage=$("#pvStage");
  const sr=stage.getBoundingClientRect();
  const from=src.getBoundingClientRect();
  const to=img.getBoundingClientRect();
  img.style.transition="none";
  img.style.position="absolute";
  img.style.left=(from.left-sr.left)+"px";
  img.style.top=(from.top-sr.top)+"px";
  img.style.width=from.width+"px";
  img.style.height=from.height+"px";
  img.style.objectFit="cover";
  void img.offsetWidth;
  img.style.transition="left .36s var(--ease), top .36s var(--ease), width .36s var(--ease), height .36s var(--ease)";

/* ---- task run engine ---- */
const runState={
  active:false, rapid:false, queue:[], qi:0,
  task:null, phases:[], pi:0, mode:"task",
  running:false, endAt:0, leftMs:0, int:null,
  elapsedMs:0, lastTickAt:null
};
function pulseClock(){
  const c=$("#trClock");
  c.classList.remove("pulse"); void c.offsetWidth; c.classList.add("pulse");
}
function runPaint(){
  const left=runState.running ? Math.max(0,runState.endAt-Date.now()) : runState.leftMs;
  $("#trClock").textContent=tmFmt(left);
  if(runState.mode==="rest"){
    $("#trTask").textContent="Rest";
    $("#trPhase").textContent="Five minutes off";
    $("#trNext").textContent="Next: "+runState.queue[runState.qi+1].title;
  }else{
    $("#trTask").textContent=(runState.rapid?((runState.qi+1)+" of "+runState.queue.length+" · "):"")+runState.task.title;
    $("#trPhase").textContent=runState.phases[runState.pi].label;
    let next="";
    if(runState.pi<runState.phases.length-1){
      next="Next: "+runState.phases[runState.pi+1].label+" · "+fmtSecs(runState.phases[runState.pi+1].secs);
    }else if(runState.rapid && runState.qi<runState.queue.length-1){ next="Then five minutes of rest"; }
    else{ next="Last block — this finishes it"; }
    $("#trNext").textContent=next;
  }
  $("#trPause").textContent=runState.running?"Pause":"Resume";
}
function runTick(){
  if(!runState.running){ runState.lastTickAt=Date.now(); return; }
  const now=Date.now();
  if(runState.lastTickAt!=null) runState.elapsedMs+=now-runState.lastTickAt;
  runState.lastTickAt=now;
  if(now>=runState.endAt){ phaseDone(); return; }
  runPaint();
}
function startPhase(i){
  runState.pi=i;
  runState.running=true;
  runState.endAt=Date.now()+runState.phases[i].secs*1000;
  runState.leftMs=runState.phases[i].secs*1000;
  runPaint();
}
function phaseDone(){
  if(runState.pi<runState.phases.length-1){ startPhase(runState.pi+1); pulseClock(); return; }
  if(runState.mode==="task"){
    const t=runState.task;
    t.done=true; t.doneAt=Date.now();
    t.timeSpent=(t.timeSpent||0)+Math.round(runState.elapsedMs/1000);
    t.updatedAt=Date.now();
    State.todos[t.id]=t; pushTodo(t);
    runState.elapsedMs=0;   // v7.3.1: already banked, don't count it twice in endRun()
  }
  if(runState.mode==="rest"){ runState.elapsedMs=0; beginTask(runState.qi+1); return; }
  if(runState.rapid && runState.qi<runState.queue.length-1){ runState.elapsedMs=0; enterRest(); return; }
  if(State.settings.timerSound) beep();
  endRun(runState.rapid ? "Rapidfire done — "+runState.queue.length+" tasks" : "\""+runState.task.title+"\" complete");
}
function enterRest(){
  runState.mode="rest";
  runState.phases=[{label:"Rest",secs:300}];
  startPhase(0); pulseClock();
}
function beginTask(i){
  runState.qi=i;
  const t=runState.queue[i];
  runState.task=t;
  runState.phases=phasesFor(t);
  runState.mode="task";
  runState.elapsedMs=0;
  runState.lastTickAt=Date.now();
  runState.running=false;
  $("#trSkip").hidden=!runState.rapid;
  startPhase(0);
}
function startTaskRun(t){
  runState.active=true; runState.rapid=false;
  runState.queue=[t];
  $("#taskRun").classList.add("on");
  beginTask(0);
  if(!runState.int) runState.int=setInterval(runTick,250);
}
function startRapidfire(list){
  if(!list.length) return;
  runState.active=true; runState.rapid=true;
  runState.queue=list;
  $("#taskRun").classList.add("on");
  beginTask(0);
  if(!runState.int) runState.int=setInterval(runTick,250);
}
function trTogglePause(){
  if(!runState.active) return;
  if(runState.running){
    runState.leftMs=Math.max(0,runState.endAt-Date.now());
    runState.running=false;
  }else{
    if(runState.leftMs<=0) return;
    runState.endAt=Date.now()+runState.leftMs;
    runState.running=true;
  }
  runPaint();
}
// v7.3.1: stopping early used to throw the session away — timeSpent only ever
// got written when every phase finished, so a normal "Stop" recorded nothing.
// Bank whatever was actually put in, without marking the task done.
function bankPartialTime(){
  if(runState.mode!=="task" || !runState.task) return;
  const secs=Math.round((runState.elapsedMs||0)/1000);
  if(secs<1) return;
  const t=runState.task;
  t.timeSpent=(t.timeSpent||0)+secs;
  t.updatedAt=Date.now();
  State.todos[t.id]=t; pushTodo(t);
}
function trStop(){
  bankPartialTime();
  clearInterval(runState.int); runState.int=null; runState.active=false;
  $("#taskRun").classList.remove("on"); renderAll();
}
function trSkip(){
  if(!runState.rapid) return;
  if(runState.mode==="rest"){ beginTask(runState.qi+1); return; }
  if(runState.qi<runState.queue.length-1){ enterRest(); return; }
  endRun("Skipped the last task");
}
function endRun(msg){
  bankPartialTime();
  clearInterval(runState.int); runState.int=null;
  runState.active=false;
  $("#taskRun").classList.remove("on");
  renderAll();
  if(msg) toast(msg);
}
 $("#trPause").addEventListener("click",trTogglePause);
 $("#trStop").addEventListener("click",trStop);
 $("#trSkip").addEventListener("click",trSkip);
(function(){
  const rn=$("#taskRun"); let sy=null;
  rn.addEventListener("touchstart",e=>{ e.stopPropagation(); if(e.touches.length===1) sy=e.touches[0].clientY; },{passive:true});
  rn.addEventListener("touchend",e=>{
    e.stopPropagation();
    if(sy==null) return;
    const dy=e.changedTouches[0].clientY-sy; sy=null;
    if(dy>70 && runState.active) trStop();
  },{passive:true});
})();

function rfRow(t,picked){

function fillRapidfire(){

function rfRecalc(){

function actualSecs(t){
  if(t.timeSpent) return t.timeSpent;
  if(t.done) return (t.duration||State.settings.defaultDuration||25)*60;
  return 0;
}
function fullDateStr(d){ return DAY_NAMES[d.getDay()]+" "+d.getDate()+" "+d.toLocaleString(undefined,{month:"long"}); }
function fmtHours(sec){
  let h=Math.floor(sec/3600), m=Math.round((sec-h*3600)/60);
  if(m===60){ h++; m=0; }
  if(h>=48) return h+"h";
  if(!h) return m+"m";
  return m? h+"h "+m+"m" : h+"h";
}
function currentWeekStart(){
  const n=new Date();
  return addDays(new Date(n.getFullYear(),n.getMonth(),n.getDate()), -((n.getDay()-State.settings.weekStart+7)%7));

function barChartSVG(W,labels,vals,avgSecs){
  const H=170;
  const n=vals.length;
  const max=Math.max.apply(null,vals.concat([1]));
  const gap=n>1?Math.min(8,Math.max(2,(W-12)/n/5)):0;
  const bw=(W-12-gap*(n-1))/n;
  const yOf=v=>8+(H-26)-Math.max(1.5,v/max*(H-26));
  const svg=sv("svg",{viewBox:"0 0 "+W+" "+H});
  vals.forEach((v,i)=>{
    const r=sv("rect",{x:(6+i*(bw+gap)).toFixed(1),y:yOf(v).toFixed(1),width:Math.max(2,bw).toFixed(1),height:(8+(H-26)-yOf(v)).toFixed(1),rx:2});
    r.style.fill="var(--fg-mid)";
    const t=sv("title"); t.textContent=labels[i].full+" · "+fmtHours(v);
    r.appendChild(t); svg.appendChild(r);
  });
  if(avgSecs>0){
    const ln=sv("line",{x1:6,x2:(W-6).toFixed(1),y1:yOf(avgSecs).toFixed(1),y2:yOf(avgSecs).toFixed(1)});
    ln.setAttribute("stroke-dasharray","4 4");
    ln.style.stroke="var(--accent)"; ln.style.strokeWidth="1.2";
    svg.appendChild(ln);
  }
  const step=Math.max(1,Math.ceil(n/Math.max(3,Math.floor(W/110))));
  labels.forEach((L,i)=>{
    if(i%step!==0 && i!==n-1) return;
    const tx=sv("text",{x:(6+i*(bw+gap)+bw/2).toFixed(1),y:H-4,"text-anchor":"middle"});
    tx.setAttribute("font-size","10");
    tx.style.fill="var(--fg-soft)";
    tx.textContent=L.short;
    svg.appendChild(tx);
  });
  return svg;
}

  }else if(stGran==="week"){
    labels=[]; vals=[];
    const curWS=currentWeekStart();
    for(let i=11;i>=0;i--){
      const w=addDays(curWS,-7*i);
      let s=0;
      for(let j=0;j<7;j++) s+=dayMap[iso(addDays(w,j))]||0;
      labels.push({short:w.getDate()+"/"+(w.getMonth()+1),full:"Week of "+fullDateStr(w)});
      vals.push(s);
    }
  }else{
    labels=[]; vals=[];
    const now=new Date();
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      let s=0;
      for(let j=0;j<dim;j++) s+=dayMap[iso(new Date(d.getFullYear(),d.getMonth(),1+j))]||0;
      labels.push({short:d.toLocaleString(undefined,{month:"short"}),full:d.toLocaleString(undefined,{month:"long"})+" "+d.getFullYear()});
      vals.push(s);
    }
  }
  const tot=vals.reduce((a,b)=>a+b,0);
  const avg=tot/vals.length;
  big.appendChild(document.createTextNode("Total "));
  big.appendChild(el("b",null,fmtHours(tot)));
  big.appendChild(document.createTextNode(" · avg "));
  big.appendChild(el("b",null,fmtHours(avg)));

  const sec2=el("div","st-sect");
  sec2.appendChild(el("h3",null,"Busiest weekday"));
  const wd=[0,0,0,0,0,0,0];
  done.forEach(t=>{ if(t.doneAt) wd[new Date(t.doneAt).getDay()]+=actualSecs(t); });
  const wdMax=Math.max.apply(null,wd);
  const wdOrder=[]; for(let i=0;i<7;i++) wdOrder.push((State.settings.weekStart+i)%7);
  const best=wdMax>0? wdOrder.slice().sort((a,b)=>wd[b]-wd[a])[0] : -1;
  const head2=el("div","st-headrow");
  const big2=el("div","st-big");
  if(best>=0){
    big2.appendChild(document.createTextNode("Busiest: "));
    big2.appendChild(el("b",null,DAY_NAMES[best]));
    big2.appendChild(document.createTextNode(" · "+fmtHours(wd[best])));
  }else big2.appendChild(document.createTextNode("No completed tasks yet"));
  head2.appendChild(big2);
  sec2.appendChild(head2);
  if(best>=0){
    const rows=el("div","st-bars");

      fill.style.background=dow===best?"var(--fg)":"var(--fg-faint)";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div","st-hval",fmtHours(wd[dow])));
      rows.appendChild(row);
    });
    sec2.appendChild(rows);
  }
  body.appendChild(sec2);
  const sec3=el("div","st-sect");
  sec3.appendChild(el("h3",null,"Study time vs coefficient weight"));
  const perSub={}; let totTime=0;
  done.forEach(t=>{ perSub[t.subject]=(perSub[t.subject]||0)+actualSecs(t); totTime+=actualSecs(t); });
  if(totTime>0){
    const totW=State.taxonomy.subjects.reduce((a,sub)=>a+subjectWeight(sub.id),0)||1;
    const legend=el("div","st-legend");
    const l1=el("span"); const i1=el("i"); i1.style.background="var(--fg-mid)";

    l2.appendChild(i2); l2.appendChild(document.createTextNode("share of total weight"));
    legend.appendChild(l1); legend.appendChild(l2);
    sec3.appendChild(legend);
    const rows=el("div","st-bars st-dual");
    State.taxonomy.subjects.map(sub=>({
      s:sub, ts:(perSub[sub.id]||0)/totTime, ws:subjectWeight(sub.id)/totW
    })).sort((a,b)=>Math.abs(b.ts-b.ws)-Math.abs(a.ts-a.ws)).forEach(r=>{
      const row=el("div","st-hrow");
      const lab=el("div","st-hlabel");
      const dot=el("i","swatch"); dot.style.background=subjectColor(r.s.id);
      lab.appendChild(dot);
      lab.appendChild(el("span",null,r.s.name));
      row.appendChild(lab);
      [[r.ts,subjectColor(r.s.id)],[r.ws,"var(--fg-faint)"]].forEach(pair=>{
        const line=el("div","st-dualline");
        const t1=el("div","st-htrack");
        const f1=el("div","st-hfill");
        f1.style.width=(pair[0]*100).toFixed(1)+"%";
        f1.style.background=pair[1];
        t1.appendChild(f1);
        line.appendChild(t1);
        line.appendChild(el("div","st-hval",Math.round(pair[0]*100)+"%"));
        row.appendChild(line);
      });
      rows.appendChild(row);
    });
    sec3.appendChild(rows);
  }else sec3.appendChild(el("div","st-note","Complete some tasks to see how your study time splits against each subject's weight."));
  body.appendChild(sec3);
  const sec4=el("div","st-sect");
  sec4.appendChild(el("h3",null,"Missed per subject"));
  const dSub={},mSub={};
  all.forEach(t=>{
    if(t.done) dSub[t.subject]=(dSub[t.subject]||0)+1;
    else if(t.missed) mSub[t.subject]=(mSub[t.subject]||0)+1;
  });
  const mrows=State.taxonomy.subjects.map(s=>{
    const d=dSub[s.id]||0, m=mSub[s.id]||0;
    return {s,m,r:d+m,rate:d+m?m/(d+m):0};
  }).filter(x=>x.r>0).sort((a,b)=>b.rate-a.rate);
  if(mrows.length){
    const rows=el("div","st-bars");
    mrows.forEach(x=>{
      const row=el("div","st-hrow");
      const lab=el("div","st-hlabel");
      const dot=el("i","swatch"); dot.style.background=subjectColor(x.s.id);
      lab.appendChild(dot);
      lab.appendChild(el("span",null,x.s.name));
      row.appendChild(lab);
      const track=el("div","st-htrack");
      const fill=el("div","st-hfill");
      fill.style.width=(x.rate*100).toFixed(1)+"%";
      fill.style.background="var(--accent)";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div","st-hval",Math.round(x.rate*100)+"% · "+x.m+" of "+x.r));
      rows.appendChild(row);
    });
    sec4.appendChild(rows);
  }else sec4.appendChild(el("div","st-note","Nothing resolved yet — missed rates appear once tasks are completed or missed."));
  body.appendChild(sec4);
  const sec5=el("div","st-sect");
  sec5.appendChild(el("h3",null,"Missed trend · last 12 weeks"));
  const curWS=currentWeekStart();
  const mw=new Array(12).fill(0);
  missed.forEach(t=>{
    if(!t.due) return;
    const dd=Math.round((curWS.getTime()-fromISO(t.due).getTime())/86400000);
    if(dd>=0){ const w=Math.floor(dd/7); if(w<12) mw[11-w]++; }
  });
  const wlabels=[];
  for(let i=11;i>=0;i--){
    const w=addDays(curWS,-7*i);
    wlabels.push({short:w.getDate()+"/"+(w.getMonth()+1),full:"Week of "+fullDateStr(w)});
  }
  const totM=mw.reduce((a,b)=>a+b,0);
  const head5=el("div","st-headrow");
  const big5=el("div","st-big");
  big5.appendChild(document.createTextNode(totM? totM+" missed in the last 12 weeks" : "No missed tasks in the last 12 weeks"));
  head5.appendChild(big5);
  sec5.appendChild(head5);
  const chart5=el("div","st-chart");
  chart5.appendChild(lineChartSVG(CW,wlabels,mw));
  sec5.appendChild(chart5);
  body.appendChild(sec5);
  body.scrollTop=keep;
}

function buildAuthCard(mode, compact){

  }
  const tabs=el("div","au-tabs");
  const tIn=el("button",null,"Sign in"); tIn.type="button";
  const tUp=el("button",null,"Create account"); tUp.type="button";
  if(!signup) tIn.classList.add("on"); else tUp.classList.add("on");
  const pick=m=>{ if(m===mode) return; c.replaceWith(buildAuthCard(m, compact)); };
  tIn.addEventListener("click",()=>pick("signin"));
  tUp.addEventListener("click",()=>pick("signup"));
  tabs.append(tIn,tUp);
  c.appendChild(tabs);
  let nameIn=null;
  if(signup){ nameIn=field(c,"Your name (optional)","text",""); nameIn.autocomplete="name"; nameIn.maxLength=40; }
  const email=field(c,"Email","text","");

  const pwf=el("div","f");
  const pl=el("label",null,"Password"); pwf.appendChild(pl);
  const wrap=el("div","au-pw");
  const pass=el("input");
  pass.type="password";
  pass.autocomplete=signup?"new-password":"current-password";
  const pid="f_"+uid(); pass.id=pid; pl.setAttribute("for",pid);
  wrap.appendChild(pass);
  const eye=el("button","au-eye");
  eye.type="button"; eye.title="Show password";
  eye.innerHTML=EYE_ON;
  let shown=false;
  eye.addEventListener("click",()=>{
    shown=!shown; pass.type=shown?"text":"password";
    eye.innerHTML=shown?EYE_OFF:EYE_ON;
    eye.title=shown?"Hide password":"Show password";
  });
  wrap.appendChild(eye);
  pwf.appendChild(wrap);
  c.appendChild(pwf);
  const err=el("div","gate-err"); c.appendChild(err);
  const go=el("button","btn primary au-go", signup?"Create account":"Sign in");
  c.appendChild(go);
  const submit=async()=>{
    err.textContent="";
    const e=email.value.trim(), p=pass.value;
    if(!e || p.length<6){ err.textContent="Enter an email and a password of at least 6 characters."; return; }
    go.textContent="…"; go.disabled=true;
    try{
      if(signup){
        const cred=await firebase.auth().createUserWithEmailAndPassword(e,p);
        const nm=nameIn?nameIn.value.trim().slice(0,40):"";
        if(nm){
          State.settings.displayName=nm; pushConfig("settings");
          try{ if(cred && cred.user && cred.user.updateProfile) cred.user.updateProfile({displayName:nm}); }catch(x){}
        }
      }
      else await firebase.auth().signInWithEmailAndPassword(e,p);
      if(WIZ.active && WIZ.step===1){
        if(signup){ WIZ.existing=false; renderWizChrome(); wizGoTo(2); }
        else{ WIZ.existing=true; renderWizChrome(); wizGoTo(1,true,"fade"); }
      }
    }catch(ex){
      err.textContent=authErrorText(ex);
      go.textContent=signup?"Create account":"Sign in";
      go.disabled=false;
    }
  };
  go.addEventListener("click",submit);
  pass.addEventListener("keydown",ev=>{ if(ev.key==="Enter") submit(); });
  return c;

function wizBuildStage(i, anim){
  const stage=$("#wzStage");
  stage.innerHTML="";

  const st=WIZ_STEPS[i];
  if(st.wide){
    stage.classList.add("wz-wide");

    stage.appendChild(el("div","wz-sub",st.sub));
    const ctr=el("div","wz-controls");
    st.build(ctr);
    stage.appendChild(ctr);
  }else{
    const cols=el("div","wz-cols");
    const left=el("div","wz-left");
    if(st.icon) left.appendChild(iconImg(st.icon));
    left.appendChild(el("div","wz-title",st.title));
    left.appendChild(el("div","wz-sub",st.sub));
    const right=el("div","wz-right");

  if(State.settings.animations && anim){
    const cls=anim==="fade"?"wz-jump-x":(anim==="f"?"wz-jump-f":"wz-jump-b");

  }

function wizGoTo(i, force, anim){
  i=clamp(i,0,WIZ_STEPS.length-1);
  if(i===WIZ.step && WIZ.active && !force) return;
  const dir=(WIZ.step<0||i>=WIZ.step)?1:-1;
  WIZ.step=i;
  renderWizChrome();
  const stage=$("#wzStage");
  const seq=++wzNavSeq;
  const build=()=>{
    if(seq!==wzNavSeq) return;
    wizBuildStage(i, anim||(dir>0?"f":"b"));
  };
  if(State.settings.animations && WIZ.active && stage.childNodes.length){
    const out=anim==="fade"?"wz-out-x":(dir>0?"wz-out-f":"wz-out-b");
    stage.classList.add(out);
    setTimeout(()=>{
      if(seq!==wzNavSeq) return;
      stage.classList.remove("wz-out-f","wz-out-b","wz-out-x");
      build();
    },165);
  }else build();
}

const TUT_KEY="bacdash.tut";

  $("#tutStep").textContent=TUT_STEPS[TUT.step];

/* =====================================================================
   18.8  CALENDAR MULTI-SELECT + ADD-MORE
   ===================================================================== */
function bodyZoom(){ return parseFloat(getComputedStyle(document.body).zoom)||1; }
const CALSEL={active:false, entries:new Map(), menu:null, rectEl:null, drag:null, blocks:null, suppressClick:false};
function calEntryFromKey(key){
  const p=(key||"").split("|");
  if(p[0]==="t") return {type:"task", task:State.todos[p[1]]};
  if(p[0]==="s"){
    const dateStr=p[1], id=p[2];
    const session=(State.schedule.days[fromISO(dateStr).getDay()]||[]).find(x=>x.id===id);
    return session?{type:"session", session, date:dateStr}:null;
  }
  return null;
}
function calToggleEntry(blk){
  const key=blk.dataset.key||"";
  if(!key) return;
  if(CALSEL.entries.has(key)){
    CALSEL.entries.delete(key);
    blk.classList.remove("sel");
  }else{
    const entry=calEntryFromKey(key);
    if(!entry) return;
    CALSEL.entries.set(key,entry);
    blk.classList.add("sel");
  }
  CALSEL.active=CALSEL.entries.size>0;
  if(CALSEL.active){
    const r=blk.getBoundingClientRect();
    showCalMenu(r.left, r.bottom+6, r);
  }else hideCalMenu();
}
function showCalMenu(x,y,anchor){
  hideCalMenu();
  // v7.4.2: on touch screens the menu is a compact row that sits ABOVE the entry you just picked,
  // so it never covers the neighbouring entries you still want to tap.
  const compact=!!anchor && window.matchMedia("(pointer:coarse)").matches;
  const entries=[...CALSEL.entries.values()];
  const hasSess=entries.some(e=>e.type==="session");
  const menu=el("div","cal-menu");
  const mk=(label,cls,fn)=>{
    const b=el("button",cls,label);
    b.type="button";
    b.addEventListener("click",ev=>{ ev.stopPropagation(); fn(); });
    menu.appendChild(b);
  };
  if(hasSess){
    mk(compact?"Delete week":"Delete for the week","danger",calDeleteForWeek);
    mk(compact?"Delete all":"Delete everywhere",null,calDeleteEverywhere);
  }else mk("Delete","danger",calDeleteForWeek);
  mk("Cancel",null,()=>calSelClear());
  document.body.appendChild(menu);
  const z=bodyZoom();
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  const vw=window.innerWidth/z, vh=window.innerHeight/z;
  if(compact){
    menu.classList.add("row");
    const cw=menu.offsetWidth, ch=menu.offsetHeight;
    let top=anchor.top-ch-6; if(top<8) top=anchor.bottom+6;
    const left=anchor.left+anchor.width/2-cw/2;
    menu.style.left=clamp(left/z,8,Math.max(8,vw-cw-8))+"px";
    menu.style.top=clamp(top/z,8,Math.max(8,vh-ch-8))+"px";
    CALSEL.menu=menu;
    return;
  }
  menu.style.left=clamp((x+8)/z,8,Math.max(8,vw-mw-8))+"px";
  menu.style.top=clamp((y+8)/z,8,Math.max(8,vh-mh-8))+"px";
  CALSEL.menu=menu;
}
function hideCalMenu(){ if(CALSEL.menu){ CALSEL.menu.remove(); CALSEL.menu=null; } }
function calSelClear(){
  if(!CALSEL.active && !CALSEL.menu && CALSEL.entries.size===0 && !CALSEL.rectEl && !CALSEL.drag) return;
  if(CALSEL.rectEl){ CALSEL.rectEl.remove(); CALSEL.rectEl=null; }
  CALSEL.drag=null; CALSEL.blocks=null;
  hideCalMenu();
  CALSEL.entries.clear();
  CALSEL.active=false;
  $$("#calGrid .tg-block.sel, #calGrid .tg-task.sel").forEach(b=>b.classList.remove("sel"));
}
function calDeleteForWeek(){
  const entries=[...CALSEL.entries.values()];
  const tasks=entries.filter(e=>e.type==="task");
  const sess=entries.filter(e=>e.type==="session");
  hideCalMenu();
  const n=tasks.length+sess.length;
  // v7.3.1: mixed selection used to read "Delete for the week" while the tasks in
  // it were actually destroyed for good. Say what happens to each kind.
  let what;
  if(tasks.length && sess.length) what = tasks.length+" task"+(tasks.length===1?"":"s")+" permanently and "+
    sess.length+" session"+(sess.length===1?"":"s")+" for this week";
  else if(sess.length) what = n+" entr"+(n===1?"y":"ies")+" for this week";
  else what = n+" task"+(n===1?"":"s");
  confirmDelete(what, async ()=>{
    for(const e of tasks) await removeTodo(e.task.id);
    if(sess.length){
      const ex=State.schedule.exceptions;
      sess.forEach(e=>{ (ex[e.date]=ex[e.date]||[]).push(e.session.id); });
      pushConfig("schedule");
    }
    calSelClear(); renderAll();
    toast(sess.length? "Deleted for this week" : "Task"+(n===1?"":"s")+" deleted");
  });
}
function calDeleteEverywhere(){
  const entries=[...CALSEL.entries.values()];
  const tasks=entries.filter(e=>e.type==="task");
  const sess=entries.filter(e=>e.type==="session");
  hideCalMenu();
  const n=tasks.length+sess.length;
  confirmDelete(n+" entr"+(n===1?"y":"ies")+" — every week", async ()=>{
    for(const e of tasks) await removeTodo(e.task.id);
    sess.forEach(e=>{
      const dow=fromISO(e.date).getDay();
      State.schedule.days[dow]=sessionsFor(dow).filter(y=>y.id!==e.session.id);
    });
    pushConfig("schedule");
    calSelClear(); renderAll();
    toast("Deleted everywhere");
  });
}
function endCalDrag(x,y){
  CALSEL.drag=null;
  if(CALSEL.rectEl){ CALSEL.rectEl.remove(); CALSEL.rectEl=null; }
  CALSEL.blocks=null;
  CALSEL.suppressClick=true;
  setTimeout(()=>{ CALSEL.suppressClick=false; },350);
  if(CALSEL.entries.size>0) showCalMenu(x,y);
}
(function(){
  $("#calGrid").addEventListener("mousedown",e=>{
    if(e.button!==0) return;
    if(!editMode || ORDER()[screenIdx]!=="calendar") return;
    if(!e.target.closest(".tg-scroll")) return;
    if(e.target.closest(".tg-block,.tg-task,.tg-addmore,.gear")) return;
    e.preventDefault();
    calSelClear();
    CALSEL.drag={x:e.clientX,y:e.clientY};
    CALSEL.blocks=$$("#calGrid .tg-block, #calGrid .tg-task").map(b=>({
      el:b, key:b.dataset.key||"", rect:b.getBoundingClientRect()
    }));
    const z=bodyZoom();
    const rect=el("div");
    rect.id="calSelRect";
    rect.style.left=(e.clientX/z)+"px"; rect.style.top=(e.clientY/z)+"px";
    rect.style.width="0px"; rect.style.height="0px";
    document.body.appendChild(rect);
    CALSEL.rectEl=rect;
  });
  window.addEventListener("mousemove",e=>{
    if(!CALSEL.drag) return;
    if(!(e.buttons&1)){
      CALSEL.drag=null;
      if(CALSEL.rectEl){ CALSEL.rectEl.remove(); CALSEL.rectEl=null; }
      CALSEL.blocks=null;
      return;
    }
    const L=Math.min(CALSEL.drag.x,e.clientX), T=Math.min(CALSEL.drag.y,e.clientY);
    const W=Math.abs(e.clientX-CALSEL.drag.x), H=Math.abs(e.clientY-CALSEL.drag.y);
    const z=bodyZoom();
    const r=CALSEL.rectEl;
    if(r){
      r.style.left=(L/z)+"px"; r.style.top=(T/z)+"px";
      r.style.width=(W/z)+"px"; r.style.height=(H/z)+"px";
    }
    CALSEL.blocks.forEach(b=>{
      const q=b.rect;
      const hit=W>4 && H>4 && q.left<L+W && q.right>L && q.top<T+H && q.bottom>T;
      if(hit){
        if(!CALSEL.entries.has(b.key)){
          const entry=calEntryFromKey(b.key);
          if(entry){ CALSEL.entries.set(b.key,entry); b.el.classList.add("sel"); }
        }
      }else if(CALSEL.entries.has(b.key)){
        CALSEL.entries.delete(b.key);
        b.el.classList.remove("sel");
      }
    });
    CALSEL.active=CALSEL.entries.size>0;
  });
  window.addEventListener("mouseup",e=>{
    if(CALSEL.drag) endCalDrag(e.clientX,e.clientY);
  });
})();
document.addEventListener("click",e=>{
  if(CALSEL.suppressClick){ CALSEL.suppressClick=false; return; }
  if(!CALSEL.menu && !CALSEL.active) return;
  if(e.target.closest && e.target.closest(".cal-menu")) return;
  if(e.target.closest && e.target.closest(".tg-block,.tg-task") && editMode && ORDER()[screenIdx]==="calendar") return;
  calSelClear();
},true);

/* =====================================================================
   18.9  ADD-MORE GENERATOR
   ===================================================================== */
function genAddMore(budgetMin, mode){
  const pool=missedPool();
  const cnt={};
  pool.forEach(t=>{ cnt[t.subject]=(cnt[t.subject]||0)+1; });
  const order=Object.keys(cnt).sort((a,b)=>(cnt[b]*subjectWeight(b))-(cnt[a]*subjectWeight(a)));
  let queue=[];
  order.forEach(sid=>{
    let ts=pool.filter(t=>t.subject===sid);
    if(mode==="oldest")       ts.sort((a,b)=>(a.due||"").localeCompare(b.due||"") || (a.createdAt||0)-(b.createdAt||0));
    else if(mode==="newest")  ts.sort((a,b)=>(b.due||"").localeCompare(a.due||"") || (b.createdAt||0)-(a.createdAt||0));
    else                      ts=shuffleArr(ts);
    queue=queue.concat(ts);
  });
  const out=[];
  let total=0;
  for(const t of queue){
    if(total>=budgetMin) break;
    out.push(t);
    total+=t.duration||State.settings.defaultDuration||25;
  }
  return {out,total};
}
function addMoreOverlap(dateStr,startMin,tasks){
  const d=fromISO(dateStr);
  const ranges=[];
  sessionsForDate(d).forEach(x=>ranges.push([minOf(x.start),minOf(x.end)]));
  dayTaskLayout(dateStr).forEach(l=>ranges.push([l.start,l.end]));
  let c=startMin;
  for(const t of tasks){
    const dur=t.duration||State.settings.defaultDuration||25;
    if(c+dur>1440) return true;
    if(ranges.some(r=>c<r[1] && r[0]<c+dur)) return true;
    c+=dur;
  }
  return false;
}
function openAddMore(dateStr){
  const d=fromISO(dateStr);
  const s=State.settings;
  const occupied=dayOccupancyMinutes(dateStr);
  const free=Math.max(0,ADDMORE_MIN_FREE-occupied);
  let mode="oldest";
  let budget=clamp(Math.round(free/10)*10,30,300);
  let gen=null;
  openEditor("Add more", b=>{
    hint(b, fullDateStr(d)+" · "+fmtMin(occupied)+" occupied · "+fmtMin(free)+" free");
    const startF=field(b,"Start at","time",pad(clamp(Math.round(s.calAnchorHour),0,23))+":00");
    bindInput(startF,()=>reset());
    rangeField(b,"About how much time",budget,30,300,10,
      null, v=>{ budget=v; reset(); }, v=>fmtMin(v));
    const pf=el("div","f");
    pf.appendChild(el("label",null,"Pick tasks"));
    const chips=el("div","chips");
    [["oldest","Prioritize oldest"],["newest","Prioritize newest"],["random","Just random"]].forEach(p=>{
      const c=el("button","chip"+(mode===p[0]?" on":""),p[1]);
      c.type="button";
      c.addEventListener("click",()=>{
        mode=p[0];
        $$(".chip",chips).forEach(x=>x.classList.remove("on"));
        c.classList.add("on");
        reset();
      });
      chips.appendChild(c);
    });
    pf.appendChild(chips);
    b.appendChild(pf);
    const genRow=el("div","f-actions");
    const genBtn=el("button","btn primary","Generate");
    genBtn.type="button";
    genBtn.disabled=missedPool().length===0;
    genRow.appendChild(genBtn);
    b.appendChild(genRow);
    const results=el("div");
    b.appendChild(results);
    function reset(){ gen=null; draw(); }
    genBtn.addEventListener("click",()=>{
      gen={...genAddMore(budget,mode), startMin:minOf(startF.value)||s.calAnchorHour*60};
      draw();
    });
    function draw(){
      genRow.style.display=gen?"none":"";
      results.innerHTML="";
      if(!gen){
        const n=missedPool().length;
        results.appendChild(el("div","f-hint", n? n+" missed task"+(n===1?"":"s")+" in the archive · press Generate to pick some." : "Nothing missed to reschedule — the archive has no missed tasks."));
        return;
      }
      if(!gen.out.length){ results.appendChild(el("div","f-hint","Nothing to add for this budget.")); return; }
      const list=el("div");
      let c=gen.startMin;
      gen.out.forEach(t=>{
        const dur=t.duration||s.defaultDuration||25;
        const row=el("div","am-item");
        const m=el("div","am-main");
        m.appendChild(el("div","am-t",t.title));
        const bits=[subjectName(t.subject), fmtMin(dur), "runs "+fmtClockMin(c)+" – "+fmtClockMin(c+dur)];
        if(t.due) bits.push("was due "+t.due);
        m.appendChild(el("div","am-d",bits.join(" · ")));
        row.appendChild(m);
        list.appendChild(row);
        c+=dur;
      });
      results.appendChild(list);
      const over=addMoreOverlap(dateStr,gen.startMin,gen.out);
      results.appendChild(el("div","am-total","All together: "+fmtMin(gen.total)));
      if(over) results.appendChild(el("div","am-total","These would overlap entries already on that day."));
      const acts=el("div","f-actions");
      const add=el("button","btn primary","Add "+gen.out.length+" task"+(gen.out.length===1?"":"s"));
      add.type="button";
      add.disabled=over;
      add.addEventListener("click",()=>commitAddMore(dateStr,gen));
      const cancel=el("button","btn","Cancel");
      cancel.type="button";
      cancel.addEventListener("click",closeEditor);
      acts.append(add,cancel);
      results.appendChild(acts);
    }
    draw();
  });
}
function commitAddMore(dateStr,gen){
  let c=gen.startMin;
  const n=gen.out.length;
  gen.out.forEach(orig=>{
    const dur=orig.duration||State.settings.defaultDuration||25;
    const t={
      id:uid(), title:orig.title, type:orig.type, subject:orig.subject,
      method:orig.method||null, due:dateStr, duration:dur,
      startMin:c, done:false, doneAt:null,
      seriesId:orig.seriesId||null, step:orig.step||null,
      // v7.3.1: carry the photos across too, otherwise the revived task pointed
      // at blobs nobody displayed even though they still exist
      ...(orig.photos&&orig.photos.length ? {photos:orig.photos.map(p=>({id:p.id,w:p.w,h:p.h}))} : {}),
      revivedFrom:orig.id,
      createdAt:Date.now(), updatedAt:Date.now()
    };
    c+=dur;
    State.todos[t.id]=t; pushTodo(t);
    orig.rescheduled=true; orig.rescheduledAt=Date.now(); orig.updatedAt=Date.now();
    State.todos[orig.id]=orig; pushTodo(orig);
  });
  closeEditor(); renderAll();
  toast(n+" task"+(n===1?"":"s")+" rescheduled");
}

/* =====================================================================
   19. BOOT
   ===================================================================== */
function boot(){
  loadLocal();
  sweepDay="";                 // v7.3.1: allow the overdue sweep on this boot
  PQ.open().then(()=>photoQueueFlush());
  applyTokens();
  buildCountShell();
  layoutScreens();
  renderPresets();
  tmSet(State.settings.timerPresets[2]||25);
  swPaint();
  tickClock(); tickCountdown(); renderAll();
  const s=State.settings;
  const narrow=window.matchMedia("(max-width:760px)").matches;
  if(s.startScreen==="quickadd" || (s.startScreen==="auto" && narrow)){
    setTimeout(()=>{
      if(WIZ.active) return;
      if(!$("#gate").classList.contains("hidden")) return;
      openQuickAdd();
    },450);
  }
  // v7.4: the always-on timers no longer repaint a hidden tab (old laptop battery),
  // and everything catches up the moment the tab is visible again.
  setInterval(()=>{ if(!bgHidden()) tickClock(); },1000);
  restartCountdownTimer();
  setInterval(()=>{ if(!bgHidden()){ renderSlot(); renderTicker(); } },60000);
  setInterval(()=>{ if(bgHidden()) return; ensureSunTimes(); if(State.settings.theme==="gradient") updateGradientTheme(); },60000);
  document.addEventListener("visibilitychange",()=>{
    if(bgHidden()){ saveLocalNow(); return; }
    tickClock(); tickCountdown(); renderSlot(); renderTicker();
    registerDevice(); photoQueueFlush(); netCheck();
  });
  setInterval(netCheck,10000);          // v7.4.1: "offline" clears itself without a reload
  setInterval(photoAutoTick,1000);      // v7.4.1: waiting photos retry on their own
  window.addEventListener("online",()=>netCheck());
  window.addEventListener("offline",()=>netCheck());
  netCheck();
  backInit();
  if(IN_APK && window.Capacitor.Plugins.ForegroundService){
    try{
      window.Capacitor.Plugins.ForegroundService.startForegroundService({
        id:1,title:"BacTrack",body:"Keeping your tasks and photos in sync",
        smallIcon:"ic_stat_sync"
      });
    }catch(e){}
  }
  if(darkMQ){
    const onScheme=()=>{ _ambientKey=""; applyAmbientTint(); };
    if(darkMQ.addEventListener) darkMQ.addEventListener("change",onScheme);
    else if(darkMQ.addListener) darkMQ.addListener(onScheme);
  }
  window.addEventListener("resize",()=>{
    clearTimeout(statsResizeT);
    statsResizeT=setTimeout(()=>{ if($("#statsScreen").classList.contains("on")) renderStatsView(); },150);
  });
  $("#swStart").addEventListener("click",swToggle);
  $("#swReset").addEventListener("click",swResetFn);
  $("#swLap").addEventListener("click",swLapFn);
  $("#tmStart").addEventListener("click",tmToggle);
  $("#tmReset").addEventListener("click",()=>tmSet(TM.dur/60000||25));
  $("#calPrev").addEventListener("click",()=>{ calOffset--; renderCalendar(); });
  $("#calNext").addEventListener("click",()=>{ calOffset++; renderCalendar(); });
  $("#calToday").addEventListener("click",()=>{ calOffset=0; renderCalendar(); });
  initSync();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();

})();
</script>
