name: Build BacTrack APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Generate app assets
        run: npx cap-assets generate --android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Permissions for the foreground service
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bactrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apkname: Build BacTrack APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Permissions for the foreground service
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              text = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
          )
          text = text.replace('<application', perms + '    <application', 1)
          with open(path, 'w') as f:
              f.write(text)
          PYEOF

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bactrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
